title: AWS Console Login Followed by MFA Tampering and Persistence
id: ff446655-5566-7788-99aa-bbccddeeff00
status: experimental
description: >
  IAM user console login from a new geography or ASN, followed within 10
  minutes by MFA deactivation, access key creation, or trail disabling. The
  sequence is the canonical account takeover post-auth chain.
references:
  - https://attack.mitre.org/techniques/T1078/004/
  - https://docs.aws.amazon.com/guardduty/latest/ug/guardduty_finding-types-active.html
author: Emmanuel Tigoue
date: 2026/05/08
logsource:
  product: aws
  service: cloudtrail
detection:
  selection_login:
    eventName: 'ConsoleLogin'
    responseElements.ConsoleLogin: 'Success'
  selection_mfa_off:
    eventName:
      - 'DeactivateMFADevice'
      - 'DeleteVirtualMFADevice'
  selection_persist:
    eventName: 'CreateAccessKey'
  selection_stealth:
    eventName:
      - 'StopLogging'
      - 'DeleteTrail'
      - 'PutEventSelectors'
  condition: 1 of selection_*
correlation:
  type: temporal
  rules:
    - selection_login
    - selection_mfa_off
    - selection_persist
    - selection_stealth
  group-by:
    - userIdentity.userName
  timespan: 10m
  condition:
    selection_login:
      gte: 1
    distinct_subsequent:
      gte: 1
falsepositives:
  - admin self-service password reset workflows that include MFA reset (allowlist by support tool user agent)
  - emergency break-glass access (allowlist by named principal, log review required)
level: critical
tags:
  - attack.initial_access
  - attack.t1078.004
  - attack.persistence
  - attack.t1098.001
  - attack.defense_evasion
  - attack.t1562.008
