title: PowerShell Encoded Command Spawned by Office
id: bbcc2233-4455-6677-8899-aabbccddeeff
status: stable
description: >
  PowerShell launched with -EncodedCommand or -enc flags whose parent is an
  Office application. Classic phishing macro payload pattern. The encoded
  payload is base64 of a download cradle.
references:
  - https://attack.mitre.org/techniques/T1059/001/
  - https://attack.mitre.org/techniques/T1566/001/
author: Emmanuel Tigoue
date: 2026/05/08
logsource:
  product: windows
  category: process_creation
detection:
  selection_powershell:
    Image|endswith:
      - '\powershell.exe'
      - '\pwsh.exe'
  selection_encoded:
    CommandLine|windash|contains:
      - ' -encodedcommand '
      - ' -enc '
      - ' -ec '
  selection_office_parent:
    ParentImage|endswith:
      - '\WINWORD.EXE'
      - '\EXCEL.EXE'
      - '\POWERPNT.EXE'
      - '\OUTLOOK.EXE'
      - '\MSACCESS.EXE'
  condition: selection_powershell and selection_encoded and selection_office_parent
falsepositives:
  - legitimate Office automation deploying signed admin scripts (rare; require code signing)
level: critical
tags:
  - attack.execution
  - attack.t1059.001
  - attack.initial_access
  - attack.t1566.001
  - attack.defense_evasion
  - attack.t1027
