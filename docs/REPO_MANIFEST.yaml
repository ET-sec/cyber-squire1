version: 1
# Repository manifest. Written 2026-09-09 (Phase 21, SWEEP-01).
#
# Every tracked path resolves to exactly one row. Rows are matched
# most-specific-first: the entry whose literal prefix is longest wins, so
# docs/grc/README.md resolves to its own row and docs/grc/RISK_ASSESSMENT.md
# resolves to docs/grc/**. Adding a file inside an already described tree needs
# no edit here. Adding a new top level thing does, and the gate says so.
#
# Some trees carry a deliberate fallback row (docs/**, scripts/**, .github/**,
# .github/workflows/*.yml). A fallback describes the tree, and the rows under it
# describe the parts that need their own sentence. There is no repository wide
# fallback on purpose: a new file at the repository root has no row and fails
# the gate, which is the whole point of the manifest.
#
# status vocabulary:
#   active    something calls it, reads it, or runs it today
#   reference kept because it documents or seeds work, with no live caller
#   archived  frozen; a marker file in the directory says when and why
#
# review triggers: {every: Nd} and {by: DATE} are evaluated by
# scripts/repo/manifest_check.py on every pull request. {event: slug, flag: VAR}
# is deferred to docs/REVIEW_REGISTER.yaml, which the nightly job evaluates.
#
# Not listed on purpose: .planning/ and .claude/. Both are gitignored, neither is
# tracked, and the gate must never try to see them.
#
# The gate: python3 scripts/repo/manifest_check.py
entries:

  # ----------------------------------------------------------------------
  # Repository root. Every one of these is listed by name. No glob covers the
  # root, so a new root file is a gate failure until somebody writes its row.
  # ----------------------------------------------------------------------
  - path: ".env.example"
    purpose: "The variable names the master compose file expects, with no values."
    status: active
    reason: "A reader can see what the stack needs without being handed a secret. Regenerated from the compose file, last on 2026-09-08."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".gitignore"
    purpose: "What git must never track: the private planning tree, the client sites, the resume generator, and the local gitleaks tripwire config."
    status: active
    reason: "Line 177 carries the dated rule that keeps builds/resume-rebuild out of the index after plan 21-01 removed it. Without the dated rules a future git add quietly reverses this phase."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".gitleaks.toml"
    purpose: "The public gitleaks config: the default rule set plus the sanitization tripwires that can be named in the open."
    status: active
    reason: "Read by the merge pipeline. The literal tripwires live in the gitignored .gitleaks.local.toml, which is why this half can stay public."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".mailmap"
    purpose: "Display-only remap of five commit identities to one canonical contributor."
    status: active
    reason: "History is untouched. Without it the contributor view splits one person across two email addresses, a machine hostname, and two bots."
    last_verified: 2026-09-09
    review: {every: 365d}

  - path: ".pr_agent.toml"
    purpose: "Model choice and review settings for the pull request review agent."
    status: active
    reason: "It holds the docs/grc/** ignore glob, so the reviewer does not re-read 96 sanitized documents on every pull request."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".pre-commit-config.yaml"
    purpose: "The pre-commit framework config: gitleaks at commit and push time, plus the terraform fmt, validate, tflint, and checkov hooks."
    status: active
    reason: "Kept for anyone who runs the pre-commit framework. This machine runs the .githooks/ scripts through core.hooksPath instead, so the two have to agree."
    last_verified: 2026-09-09
    review: {every: 180d}
    rewrite_later: "Three hooks still target terraform/cd-do-infrastructure/, which is archived: terraform_tflint, terraform_checkov, and the conftest-terraform local hook."

  - path: ".semgrepignore"
    purpose: "Paths semgrep skips: the deprecated tree and the two suspended AWS terraform directories."
    status: active
    reason: "Archived infrastructure would otherwise fill every merge scan with findings nobody is going to fix."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "CONTRIBUTING.md"
    purpose: "How to work in this repository: branch naming, the hook chain, and what a pull request has to carry."
    status: active
    reason: "The public front door for anyone reading the repository as a work sample."
    last_verified: 2026-09-09
    review: {every: 365d}

  - path: "LICENSE"
    purpose: "The license the published tree is offered under."
    status: active
    reason: "A public repository without one is unusable by anybody who finds it."
    last_verified: 2026-09-09
    review: {every: 365d}

  - path: "README.md"
    purpose: "The repository front page: what the platform is, what runs, and where the evidence lives."
    status: active
    reason: "It is the first thing a reviewer or a hiring manager reads, and it links every directory a reader needs."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "SECURITY.md"
    purpose: "The vulnerability disclosure contact and the response expectation."
    status: active
    reason: "A security repository with no disclosure path contradicts itself."
    last_verified: 2026-09-09
    review: {every: 365d}

  - path: "metrics.yaml"
    purpose: "The canonical numeric facts, generated from the filesystem by scripts/build_metrics.py."
    status: active
    reason: "Every count on the site and in the documents traces here, so no number is typed twice. The pre-commit hook rebuilds it whenever a counted source changes, which makes drift impossible rather than merely unlikely."
    last_verified: 2026-09-09
    review: {every: 90d}

  - path: "renovate.json"
    purpose: "Dependency update policy: schedule, limits, and the per-tier rules that keep the security boundary images on manual review."
    status: active
    reason: "It is what keeps digest pins current without letting an automatic merge move a boundary image."
    last_verified: 2026-09-09
    review: {every: 180d}

  # ----------------------------------------------------------------------
  # .agents: the signed agent registry
  # ----------------------------------------------------------------------
  - path: ".agents/README.md"
    purpose: "How the agent registry and the card signing chain fit together."
    status: active
    reason: "The registry is unreadable without it; the card schema alone does not explain the signing flow."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".agents/registry.yaml"
    purpose: "One row per agent in the platform, with its owner, runtime location, and the card that describes it."
    status: active
    reason: "The inventory scanner in .github/workflows/agent-inventory.yml diffs this against the tree and fails on an agent nobody declared."
    last_verified: 2026-09-09
    review: {every: 180d}
    rewrite_later: "Five runtime_location values cite Agent_Squire/langgraph/, a directory that does not exist. The cards need a re-sign pass once the paths are true."

  - path: ".agents/*.card.json"
    purpose: "Thirteen agent cards: purpose, owner, model, tools, data classes, and the limits each agent runs under."
    status: active
    reason: "The card is what a reviewer reads to answer what an agent may touch. Validated against .agents schema by scripts/grc/validate_agent_cards.py in CI."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".agents/*.card.json.sigstore.json"
    purpose: "The sigstore bundle proving each card was signed by this repository's workflow identity."
    status: active
    reason: "Without the bundle a card is a claim rather than evidence. Verified by .github/workflows/agent-verify.yml on every pull request."
    last_verified: 2026-09-09
    review: {every: 180d}

  # ----------------------------------------------------------------------
  # .githooks: the local gates
  # ----------------------------------------------------------------------
  - path: ".githooks/**"
    purpose: "The two hooks core.hooksPath points at: pre-commit runs gitleaks fail closed, sweeps staged markdown for dash tells, and rebuilds metrics.yaml; pre-push rescans every local commit not yet on a remote."
    status: active
    reason: "They move the secret boundary from CI to the laptop. On a public repository a pushed branch is already public, so a scan that only runs after the push is a scan that runs too late."
    last_verified: 2026-09-09
    review: {every: 180d}

  # ----------------------------------------------------------------------
  # .github: CI, review policy, and supply chain configuration
  # ----------------------------------------------------------------------
  - path: ".github/**"
    purpose: "Repository configuration that is not a workflow: the labeler, the pull request template, and the assistant instructions."
    status: active
    reason: "The fallback row for this tree. Workflows and the files listed below carry their own rows; the rest is small configuration that changes together."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".github/workflows/*.yml"
    purpose: "The GitHub Actions workflows: pull request gates, merge scans, nightly drift, agent signing and verification, and the portfolio publish."
    status: active
    reason: "This is the enforcement layer. Every control the governance library claims as automated points at a job in this directory. The fallback row; the workflows below carry their own."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".github/workflows/security.yml"
    purpose: "The merge pipeline: Trivy, Semgrep, Gitleaks, cosign image verification, SBOM, and the POA and M sync."
    status: active
    reason: "It is the single gate every merge to main passes through, and it carries evidence anchors cited on the published architecture views."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".github/workflows/terraform-pr.yml"
    purpose: "The credential free pull request pipeline for infrastructure changes: fmt, validate, Checkov, the OPA fixture self test, and a plan comment."
    status: active
    reason: "It proves policy on a pull request from a fork or a branch without handing the job any cloud credential."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".github/workflows/terraform-main.yml"
    purpose: "The real plan and conftest run on main after every merge, with apply held behind the production environment."
    status: active
    reason: "Apply stays off until the CI identity is granted write and CI_APPLY_ENABLED is set, so this file is the record of a gate that is built and deliberately closed."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".github/workflows/drift-check.yml"
    purpose: "The nightly job that plans against the live infrastructure and alerts on any difference from the committed state."
    status: active
    reason: "Drift that nobody looks for is drift that becomes the new baseline. It carries fourteen evidence anchors, so any line added above them shifts the anchor lines."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".github/workflows/grc-validate.yml"
    purpose: "Frontmatter, POA and M identifier integrity, and classification policy checks over the governance library, run with conftest against policies/grc/."
    status: active
    reason: "It is what keeps 96 documents from drifting into inconsistency one edit at a time."
    last_verified: 2026-09-09
    review: {every: 180d}
    rewrite_later: "The path filter builds/grc_librarian/** has never matched a tracked path. manifest_check.py reports it as a dead filter on every run."

  - path: ".github/workflows/image-smoke.yml"
    purpose: "A pull time smoke test that the pinned container images still resolve and start."
    status: active
    reason: "A digest pin that no longer exists upstream fails at deploy time otherwise, on the host, at the worst moment."
    last_verified: 2026-09-09
    review: {every: 180d}
    rewrite_later: "The path filter names COREDIRECTIVE_ENGINE/docker-compose.yml while the tracked file is docker-compose.yaml, so the filter has been dead on a one letter difference."

  - path: ".github/ISSUE_TEMPLATE/**"
    purpose: "Issue forms for bug reports, feature requests, and ground truth audit findings, plus the chooser config."
    status: active
    reason: "The audit finding template is the intake path for the ground truth protocol, so it is part of a documented process rather than decoration."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".github/actions/**"
    purpose: "The composite action that exchanges the job's GitHub OIDC token for a cloud session, so no cloud key is stored in the repository."
    status: active
    reason: "Every credentialed infrastructure job depends on it. It is the reason the CI identity holds no long lived cloud key."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".github/keys/**"
    purpose: "The one publisher signing key pinned by digest policy, for a publisher that signs with a key rather than keylessly."
    status: active
    reason: "scripts/verify_image_signatures.py reads it through .github/image-signers.json, and SSP control SR-11 cites the path as evidence."
    last_verified: 2026-09-09
    review: {every: 365d}

  - path: ".github/CODEOWNERS"
    purpose: "Who must review each part of the tree."
    status: active
    reason: "Review ownership is a claimed control, and this file is what makes the claim enforceable rather than aspirational."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: ".github/image-signers.json"
    purpose: "Per publisher signing policy for every image the compose files pin: keyless, key, or explicitly unsigned with a note."
    status: active
    reason: "It fails closed. An image with no entry fails the merge, and an unsigned entry that suddenly grows a signature is reported instead of silently accepted."
    last_verified: 2026-09-09
    review: {every: 180d}

  # ----------------------------------------------------------------------
  # Agent_Squire: scanner input, stale content
  # ----------------------------------------------------------------------
  - path: "Agent_Squire/**"
    purpose: "Four per agent telemetry stubs and one n8n function snippet that tags outbound calls with an agent identifier."
    status: reference
    reason: "Live as a scanner input: scripts/observers/agents.py, two inventory sources, the agent inventory workflow, CODEOWNERS, and the labeler all read this path. Stale as content, and it carries zero evidence anchors, so nothing published depends on what is inside it."
    last_verified: 2026-09-09
    review: {event: identity_tier_live, flag: TRIGGER_IDENTITY_TIER}
    rewrite_later: "docs/grc/GUARDRAILS_CONFIGURATION.md calls this the public mirror of the agent code, which overstates four telemetry stubs."

  # ----------------------------------------------------------------------
  # COREDIRECTIVE_ENGINE: the compose definitions
  # ----------------------------------------------------------------------
  - path: "COREDIRECTIVE_ENGINE/docker-compose.yaml"
    purpose: "The full nineteen service stack definition: databases, orchestration, identity, secrets, inference, observability, and the runtime detection agents."
    status: active
    reason: "The most referenced file in the repository, with fifty three evidence anchors on the published views plus the renovate matcher, the image smoke test, and the image signature check. It is the design of record even where a service is not running today."
    last_verified: 2026-09-09
    review: {every: 90d}

  - path: "COREDIRECTIVE_ENGINE/docker-compose.oci-core.yaml"
    purpose: "The definition of what actually runs on the instance today: the database, the automation service, and the tunnel."
    status: active
    reason: "The live host file is a copy of this one, so this is the only honest answer to what is running. Kept separate from the full design so neither file has to lie."
    last_verified: 2026-09-09
    review: {event: provider_terms_change, flag: TRIGGER_PROVIDER_TERMS}

  # ----------------------------------------------------------------------
  # builds: the Squire agent, and nothing else
  # ----------------------------------------------------------------------
  - path: "builds/squire/**"
    purpose: "The Squire agent service: packaging, container definition, dependency manifest, and the readme that explains its graph."
    status: active
    reason: "The one application this platform builds. builds/* is ignored and only this subtree is re-included, which is what keeps the rest of the builds directory private."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "builds/squire/src/**"
    purpose: "The application: the FastAPI surface, the analysis graph and its nodes, the guardrail clients, retrieval, persistence, and the cost ceiling."
    status: active
    reason: "Fifty two evidence anchors across six view node files point into this tree, and the fail open branches in llm_backend.py are the Phase 22 target."
    last_verified: 2026-09-09
    review: {every: 90d}

  - path: "builds/squire/tests/**"
    purpose: "The Squire suite: unit tests, graph integration, guardrail red team cases, and the evaluation harness."
    status: active
    reason: "The red team cases and the latency budget are the evidence behind the AI security claims, so the tests are part of the argument rather than only part of the build."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "builds/squire/docker/nemo_config/**"
    purpose: "The guardrail configuration: rails definitions, prompts, and the container that serves them."
    status: active
    reason: "The input and output rails are the enforcement point for prompt injection and data leakage, and the block signal the application parses is defined here."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "builds/squire/config/actions.yml"
    purpose: "The action allow list the agent is bound to, currently recommend only."
    status: active
    reason: "It fails closed. A missing or unreadable file rejects every action rather than defaulting to permitted, which is the whole reason the file is separate from the code."
    last_verified: 2026-09-09
    review: {every: 180d}

  # ----------------------------------------------------------------------
  # detections: what the platform watches for
  # ----------------------------------------------------------------------
  - path: "detections/falco/**"
    purpose: "Runtime rules for the host: unexpected outbound traffic from the automation container, and the measured host noise exceptions that keep it quiet."
    status: active
    reason: "These run on the instance. The tuning file records three exceptions measured against real host noise, so the rule is usable rather than merely written."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "detections/sigma/**"
    purpose: "Portable detection rules in three families: edge and access events, host and container behaviour, and the AI specific rules covering injection, PII blocks, and cost ceiling breaches."
    status: active
    reason: "Counted into metrics.yaml by scripts/build_metrics.py, cited by six evidence anchors, and the AI family is the part of the detection library that is hard to find anywhere else."
    last_verified: 2026-09-09
    review: {every: 180d}

  # ----------------------------------------------------------------------
  # docs: the evidence package
  # ----------------------------------------------------------------------
  - path: "docs/**"
    purpose: "The documentation tree: governance library, architecture records, published views, and the two machine read registries at the docs root."
    status: active
    reason: "The fallback row for this tree, so a registry or a protocol document added at the docs root is described the day it lands. The subtrees and the documents below carry their own rows."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/REPO_MANIFEST.yaml"
    purpose: "This file: one row for every tracked path, with what it is, why it stays, when it was last checked, and what would make somebody look again."
    status: active
    reason: "It is the answer to the question the repository could not answer before Phase 21: why is this here. scripts/repo/manifest_check.py fails the pull request when a tracked path has no row."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/GROUND_TRUTH_AUDIT_PROTOCOL.md"
    purpose: "The procedure for auditing a claim against the filesystem rather than against memory."
    status: active
    reason: "It is the written form of the rule that a count is not published until it is verified from source, and the audit finding issue template is its intake."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/MASTER_SYNC_ARCHITECTURE.md"
    purpose: "How generated numbers and generated blocks reach the published site: the marker namespaces, the sync scripts, and the injection contract."
    status: active
    reason: "The marker contract is invisible in the code, so removing this document makes the two sync scripts unreadable."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/WORKFLOW_GUIDE.md"
    purpose: "What each workflow does, when it runs, and what it needs to pass."
    status: active
    reason: "The map between a red check and the thing that has to be fixed."
    last_verified: 2026-09-09
    review: {every: 180d}
    rewrite_later: "Line 141 describes re-shipping the compose admission and grc_librarian workflows as a bundle. Neither workflow exists, and the grc_librarian tracking decision is recorded as a known gap in scripts/repo/manifest_allow_list.yaml."

  - path: "docs/context/**"
    purpose: "Dated probe evidence: what was measured, on what version, and which path was chosen as a result."
    status: reference
    reason: "Kept so a deferred decision does not get re-litigated from memory. Nothing reads it programmatically."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/architecture/**"
    purpose: "The architecture record: information flows, stack overview, the OWASP LLM mapping, and the mermaid sources behind them."
    status: active
    reason: "The fallback row for the architecture tree, which explains the platform to a reader who is not going to read the compose file."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/architecture/decisions/**"
    purpose: "Six decision records, each naming the control it satisfies and the artifact that proves it."
    status: active
    reason: "The record of why the platform is shaped this way. Each row states what proves the decision, so a reviewer can check rather than take it on trust."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/architecture/views/**"
    purpose: "The seven published architecture views: the drawings, the generators that emit them, and the view index."
    status: active
    reason: "These are what a reviewer actually looks at. scripts/sync_views.py publishes them to the portfolio and refuses to sync when a view and its evidence disagree."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/architecture/views/nodes/**"
    purpose: "One node table per view: every box on the drawing with its zone, its controls, its honest status, and the file and line that proves it."
    status: active
    reason: "The evidence anchors live here, 419 of them. Any content edit that shifts a cited line breaks the publish until scripts/site/remap_anchors.py is run once, so this is the most fragile tree in the repository and the most load bearing."
    last_verified: 2026-09-09
    review: {every: 90d}

  - path: "docs/grc/**"
    purpose: "The sanitized governance library: system security plan, risk assessment, crosswalks, threat models, audits, and the executive summaries."
    status: active
    reason: "The public evidence package, and the corpus the retrieval side of Squire indexes. The fallback row for this tree."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/grc/README.md"
    purpose: "The library index: reading order, framework alignment, a table per category, the review schedule, and the reproducible statistics."
    status: active
    reason: "Ninety six documents with no index is a pile. This is what makes it a library."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/grc/POLICY_*.md"
    purpose: "Ten policies covering access control, change management, incident response, risk, vulnerability management, continuity, recovery, acceptable use, awareness, and AI governance."
    status: active
    reason: "Policy is what a control maps back to. Each carries the frontmatter that grc-validate.yml enforces, so a policy cannot lose its owner or its review date without failing a pull request."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/grc/PLAYBOOK_*.md"
    purpose: "Five incident response playbooks: compromised container, leaked credential, unauthorized access, service degradation, and an AI specific incident."
    status: active
    reason: "A response plan that exists only in a policy is not a plan. These are the step level versions, and the AI incident playbook is the one most organisations do not have."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/grc/POAM_AUTO_FINDINGS.md"
    purpose: "The machine written half of the plan of action: findings the merge pipeline discovered, with their identifiers."
    status: active
    reason: "Written by the poam-sync job rather than by hand, which is what keeps the ledger honest about what the scanners actually found."
    last_verified: 2026-09-09
    review: {every: 90d}

  - path: "docs/grc/GUARDRAILS_CONFIGURATION.md"
    purpose: "How the guardrail rails are configured, what each blocks, and how a block reaches the caller."
    status: active
    reason: "The written form of the AI security control that most of the threat model depends on."
    last_verified: 2026-09-09
    review: {every: 180d}
    rewrite_later: "It calls Agent_Squire/ the public mirror of the agent code. The directory holds four telemetry stubs and one snippet, so the sentence overstates what is there."

  - path: "docs/grc/diagrams/**"
    purpose: "Rendered evidence graphics and the HTML sources they come from: control coverage, data flow, risk heat map, pipeline, topology, and the stack hero."
    status: active
    reason: "Both halves are kept on purpose. The HTML source is how a graphic is regenerated when a number changes; the rendered file is what a document embeds."
    last_verified: 2026-09-09
    review: {every: 180d}

  - path: "docs/grc/oscal/**"
    purpose: "The machine readable form of the system security plan, component definition, and plan of action, with the schemas they validate against."
    status: active
    reason: "It is the format an assessor's tooling can ingest, and the validation summary records that the output actually validates rather than merely existing."
    last_verified: 2026-09-09
    review: {every: 180d}

  # ----------------------------------------------------------------------
  # infra: conftest policies with no live caller
  # ----------------------------------------------------------------------
  - path: "infra/**"
    purpose: "Seven conftest policies for the compose file, covering privileged containers, resource limits, image tags, registries, host networking, healthchecks, and read only root filesystems, plus their readme and the archived marker."
    status: archived
    reason: "Nothing calls it. The CI conftest runs are against policies/grc/ in grc-validate.yml and against terraform/cd-oci-infrastructure/policy/ in terraform-pr.yml, and the compose admission workflow its readme describes has never existed. Kept because the policies are a working reference for the OPA work and removing them would need a private copy for no gain. infra/ARCHIVED.md records when it stopped being called and what would bring it back."
    last_verified: 2026-09-09
    review: {every: 180d}

  # ----------------------------------------------------------------------
  # keycloak: the identity tier
  # ----------------------------------------------------------------------
  - path: "keycloak/**"
    purpose: "The realm export: clients, roles, and scopes for the identity tier."
    status: active
    reason: "Three evidence anchors on the published views cite it, so removing it breaks the publish. What is inside it depends on the Phase 24 identity tier coming up."
    last_verified: 2026-09-09
    review: {event: identity_tier_live, flag: TRIGGER_IDENTITY_TIER}

  # ----------------------------------------------------------------------
  # policies: the OPA policies CI runs against the library
  # ----------------------------------------------------------------------
  - path: "policies/grc/**"
    purpose: "Three Rego policies over the governance library: required frontmatter, POA and M identifier integrity, and classification."
    status: active
    reason: "grc-validate.yml runs conftest against this directory on every pull request that touches the library, which is what makes the frontmatter contract real."
