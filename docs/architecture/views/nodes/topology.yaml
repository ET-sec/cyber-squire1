      - {label: "Rate limit on the webhook path", path: terraform/cd-cloudflare-edge/waf.tf, line: 57}
      - {label: "Detection rule on WAF block bursts", path: detections/sigma/cloudflare/waf-block-burst.yml, line: 1}
      - {label: "Detection rule on edge brute force", path: detections/sigma/cloudflare/access-brute-force.yml, line: 1}
    solidify: "Control layers: managed ruleset and DNS records pending import"

  - id: cloudflared
    label: "cloudflared"
    zone: host
