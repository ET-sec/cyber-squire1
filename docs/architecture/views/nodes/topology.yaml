    controls: [SC-7, SC-8, CM-7]
    status: live
    status_note: "One of the three live containers; since 2026-09-06 it runs read-only with scratch space on tmpfs, under a processor, memory, and process cap, from an image pinned by digest, all confirmed on the host."
    evidence:
      - {label: "Live definition on the current host", path: COREDIRECTIVE_ENGINE/docker-compose.oci-core.yaml, line: 89}
      - {label: "Full design", path: COREDIRECTIVE_ENGINE/docker-compose.yaml, line: 656}
      - {label: "Host networking accepted as risk", path: docs/grc/POAM_PLAN_OF_ACTION.md, line: 615}
    solidify: "closed 2026-09-06: read_only, limits, and digest pin on the live tunnel"

