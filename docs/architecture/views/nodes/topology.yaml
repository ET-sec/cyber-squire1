# Node table for the topology view. One entry per box on the drawing, keyed by the exact label text.
# scripts/sync_views.py reads this, wraps the matching rect+text in a clickable group, and emits the JSON the
# panel reads. It refuses to sync if a control id has no row in SSP section 5, an evidence path is not tracked
# on main, a label is not found exactly once in the SVG, or a status is outside live | partial | designed.
# Fields: id, label (as drawn), zone, what (one sentence), controls (800-53 ids), status, status_note (one
# sentence, honest, from SOLIDIFY where a row exists), evidence ({label, path, line} in this repo; line is N or
# N-M), solidify (private cross-reference, never emitted to the page).
nodes:
  - id: users
    label: "users, operators"
    zone: outside
    what: "The people who reach the platform: the owner as operator over SSH and the consoles, and automation callers holding a service token, every one of them identity-checked at the edge before the host sees a request."
    controls: [AC-2, IA-2, IA-2(1), AC-6]
    status: live
    status_note: "The operator account and one edge service token for automation callers exist today; access is reviewed quarterly and every console has its own login behind the edge check."
    evidence:
      - {label: "Edge policy naming who may pass", path: terraform/cd-cloudflare-edge/access_n8n.tf, line: 31}
      - {label: "Service token for automation callers", path: terraform/cd-cloudflare-edge/access_n8n.tf, line: 45}
      - {label: "Role definitions", path: docs/grc/IAM_RBAC_ROLE_MAP.md, line: 71}
      - {label: "Quarterly access review", path: docs/grc/IAM_ACCESS_REVIEW.md, line: 7}
    solidify: "Identity view: 24h Access session, email PIN on the consoles"

  - id: claude-api
    label: "Claude API"
    zone: outside
    what: "The hosted model behind the agent, reached only through the guardrails container, with a daily spend ceiling and a trace on every call."
    controls: [SA-9, SC-7, SC-8, AC-4]
    status: designed
    status_note: "No process on the current host calls the API today; the agent and the guardrails return with the ARM rebuild, and the ceiling and the tracing are code in the repo."
    evidence:
      - {label: "API backend", path: builds/squire/src/squire/llm_backend.py, line: 81}
      - {label: "Rails backend in front of the API", path: builds/squire/src/squire/llm_backend.py, line: 286}
      - {label: "Daily spend ceiling", path: builds/squire/src/squire/cost_ceiling.py, line: 68}
      - {label: "Data flow classification", path: docs/grc/SQUIRE_DATA_FLOW_CLASSIFICATION.md, line: 1}
    solidify: "Tier 1: rails fail open on timeout, model key in the agent's environment"

  - id: allowlisted-range
    label: "allowlisted source range"
    zone: outside
    what: "The only address range allowed to open SSH to the host, set as a Terraform variable and applied to the host's security list."
    controls: [SC-7, AC-3, CM-7]
    status: live
    status_note: "Applied on the current host; it exists because the tunnel is a single point of failure and this is the break-glass path when the tunnel is down."
    evidence:
      - {label: "SSH ingress rule from the allowed range", path: terraform/cd-oci-infrastructure/networking.tf, line: 52-71}
      - {label: "The range as a variable", path: terraform/cd-oci-infrastructure/variables.tf, line: 166}
    solidify: "none (POAM-021 closed 2026-09-06)"

  - id: access
    label: "Access"
    zone: edge
    what: "Identity is checked at the edge before any request reaches the origin: an email one-time PIN for the consoles, a service token for automation callers, a source-scoped bypass for the messaging webhook."
    controls: [AC-3, IA-2, SC-7, AC-12]
    status: live
    status_note: "Live with email one-time PIN and a 24 hour session; single sign-on from Keycloak and a hardware key on the policy are the design."
    evidence:
      - {label: "Access application", path: terraform/cd-cloudflare-edge/access_n8n.tf, line: 14}
      - {label: "Allow policy, email PIN", path: terraform/cd-cloudflare-edge/access_n8n.tf, line: 31}
      - {label: "Service token policy", path: terraform/cd-cloudflare-edge/access_n8n.tf, line: 50}
      - {label: "Webhook carve-out, source-scoped", path: terraform/cd-cloudflare-edge/access_n8n.tf, line: 66}
    solidify: "Tier 2: Access is email OTP, not Keycloak SSO; Identity view: 24h session"

  - id: waf
    label: "WAF + DDoS"
    zone: edge
    what: "The edge blocks scanner user agents, geo-fences the admin paths, watches honeytoken paths, and rate limits the webhook path before traffic reaches the tunnel."
    controls: [SC-5, SI-4, SC-7]
    status: live
    status_note: "The custom ruleset and the rate limit are Terraform and applied; the managed ruleset and the DNS records are dashboard config pending import into the module."
    evidence:
