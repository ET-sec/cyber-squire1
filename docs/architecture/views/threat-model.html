<style>

</style>

    <h1>CoreDirective reference architecture</h1>
    <p>six attacker positions, the wall that meets each one, and what remains after the walls</p>
    <span class="tag">Threat model</span>

d a sealed segment with no route home. A right rail carries the counts: 29 STRIDE threats across 8 trust boundaries, 7 attack paths, 10 AI threats cataloged, 20 red-team cases with 0 bypasses, 11 pentest findings with 0 critical and 4 accepted with compensating controls, and 0 application ports open to the internet. Residual ratings come from the STRIDE register after controls.">
