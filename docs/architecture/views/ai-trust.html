<div class="page">
  <div class="head">
    <h1>CoreDirective reference architecture</h1>
    <p>five models, one search API, three trust levels; every crossing out of the host drawn with what stands in front of it</p>
    <span class="tag">AI trust</span>
  </div>

  <figure>
  <svg viewBox="0 0 1700 664" role="img" aria-label="AI trust view of the CoreDirective platform. Three trust levels drawn as bands. Outside the host, vendor models: a frontier model for the three reasoning nodes, a classifier for one structured call, an embeddings model, and a web search API; a data processing agreement is on file for the model and embeddings vendors, terms of service for search. A host boundary line separates them; five crossings go out, each one drawn: the prompt, alert queries and corpus chunks to the embeddings model, search terms, and a text notification. Inside net-core, guardrails stand in front of the model calls, with the PII model baked into the guardrails image and offline enforced: an alert payload, attacker-influenced by definition, passes a shared-secret token check and typed schema, a regex PII scrub before the graph, and an input rail with NER PII detection as a second pass, then reaches the model egress point with a daily spend cap and a trace on every call. The completion returns through output checks for PII, citations, and verbs, a recommend-only allowlist, and a human gate where HIGH and CRITICAL findings wait, then a notification with the chat ID checked reaches the operator, who reads, decides, and acts. The embed step sends corpus chunks at ingest and alert queries per run to the embeddings model and stores vectors in a bridge-only Postgres. The enrich node sends indicators and the rule name to web search. A voice note from the operator goes down to speech to text on the sealed segment; the audio never comes back up, only the transcript does. Below a sealed boundary, net-ai holds a local LLM used as fallback when the spend cap trips and the speech to text model, both with no internet route. Tags under the screens are the OWASP Top 10 for LLM Applications 2026 (LLM) and the OWASP Top 10 for Agentic Applications 2026 (ASI).">
