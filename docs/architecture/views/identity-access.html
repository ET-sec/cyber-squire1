<div class="page">
  <div class="head">
    <h1>CoreDirective reference architecture</h1>
    <p>four privilege tiers, every credential named with its lifetime, sanitized, no addresses, ports, or versions</p>
    <span class="tag">Identity and access</span>
  </div>

  <figure>
  <svg viewBox="0 0 1700 790" role="img" aria-label="Identity and access view of the CoreDirective platform. Four privilege tiers drawn as horizontal bands, each with principals on the left, decision points in the middle, resources on the right, and a note on what a stolen credential reaches. Tier 0, break-glass: an allowlisted source range reaches the host SSH daemon with a static key and lands on the host shell with no broker in the path. Tier 1, operator: humans reach admin consoles through an email one-time PIN with a 24 hour session, and reach host SSH and the database through Keycloak single sign-on into Teleport with TOTP, recorded sessions, and just-in-time elevation that expires after four hours. Tier 2, service: n8n and services fetch dynamic database credentials from Vault by AppRole on a one hour lease; the CI runner trades a signed JWT from the main branch for a cloud token that lives minutes and is read-only; Telegram reaches one webhook path through an Access bypass limited to its published ranges with a chat ID check. Tier 3, agent: alert sources reach Squire with a rotated shared-secret webhook header and a schema-checked payload; Squire reaches the Claude API only through Guardrails, which holds the API key and the spend cap; Squire notifies Telegram through a typed actions allowlist. A perfect prompt injection reaches the allowlist, never the operator or cloud planes.">
