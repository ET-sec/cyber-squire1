# Pre-commit hooks for Terraform quality gates
# Install: pre-commit install
# Manual run: pre-commit run --all-files
#
# Scoped to terraform/cd-do-infrastructure/ only.
# Legacy directories (simple-ec2, cd-aws-automation) are suspended
# and excluded to avoid blocking active development.
repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.105.0
    hooks:
      - id: terraform_fmt
        files: terraform/cd-do-infrastructure/
        args:
          - --args=-diff
          - --args=-write=true
      - id: terraform_validate
        files: terraform/cd-do-infrastructure/
      - id: terraform_tflint
        files: terraform/cd-do-infrastructure/
        args:
          - --args=--config=__GIT_WORKING_DIR__/terraform/cd-do-infrastructure/.tflint.hcl
      - id: terraform_checkov
        files: terraform/cd-do-infrastructure/
        args:
          - --args=--config-file __GIT_WORKING_DIR__/terraform/cd-do-infrastructure/.checkov.yaml
  - repo: local
    hooks:
      - id: conftest-terraform
        name: OPA Policy Check (conftest)
        entry: scripts/conftest-check.sh
        language: script
        files: terraform/cd-do-infrastructure/policy/.*\.rego$
        pass_filenames: false
