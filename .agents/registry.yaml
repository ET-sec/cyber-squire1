# Agent Registry - CoreDirective Phase 20 (CoSAI Visibility)
# Schema: scripts/grc/registry_schema.json
# Validate: python3 -c "import json,yaml,jsonschema; jsonschema.validate(yaml.safe_load(open('.agents/registry.yaml')), json.load(open('scripts/grc/registry_schema.json')))"
#
# This file is the single source of truth for every LLM-calling agent in the
# CoreDirective stack. Downstream artifacts in Phase 20 (Agent Cards, Cosign
# signatures, inventory_scan diffs, Datadog agent_id tags, capability matrix)
# all key off agent_id and sensitivity_tier defined here.
#
# Adding or modifying a row: see .agents/README.md "Adding a New Agent".
# Tier semantics (low / medium / high / critical): see .agents/README.md.
# Non-LLM tooling identities (drift observer, image scanners, etc.) are
# intentionally absent; they belong in stack-facts.yaml, not here.

agents:
  - agent_id: squire
    runtime_location: "Agent_Squire/langgraph/squire_graph.py"
    owner: etigoue
    sensitivity_tier: medium
    capabilities:
      - soc_triage
      - langgraph_invoke
      - read_alerts
      - read_grc_corpus
      - read_datadog
      - draft_runbook
      - classify_alert
      - summarize_incident
    data_access:
      - "docs/grc/**"
      - "datadog:read_only"
      - "alert_payloads"
    auth_method: keycloak_service_account
    last_audited: "2026-05-31"
    is_ai_agent: true

  - agent_id: blue_squire
    runtime_location: "Agent_Squire/langgraph/blue_squire_graph.py"
    owner: etigoue
    sensitivity_tier: high
    capabilities:
      - execute_runbook
      - post_telegram
      - write_notion
      - read_vault
      - page_oncall
      - invoke_n8n_webhook
    data_access:
      - "n8n_webhooks"
      - "telegram_channel:incident"
      - "notion_db:incident_log"
      - "vault:read_only"
    auth_method: keycloak_service_account
    last_audited: "2026-05-31"
    is_ai_agent: true

  - agent_id: red_squire
