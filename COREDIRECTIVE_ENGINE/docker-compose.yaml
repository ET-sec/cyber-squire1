services:
  cd-service-db:
    image: postgres:16-alpine
    container_name: cd-service-db
    restart: always
    environment:
      POSTGRES_USER: ${CD_DB_USER}
      POSTGRES_PASSWORD: ${CD_DB_PASS}
      POSTGRES_DB: ${CD_DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - ./CD_VOL_POSTGRES:/var/lib/postgresql/data:z
      - ./CD_BACKUPS:/backups:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CD_DB_USER} -d ${CD_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cd-net

  cd-service-n8n:
    image: n8nio/n8n:latest
    container_name: cd-service-n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=cd-service-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${CD_DB_NAME}
      - DB_POSTGRESDB_USER=${CD_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${CD_DB_PASS}
      - N8N_ENCRYPTION_KEY=${CD_N8N_KEY}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${CD_N8N_JWT}
      - N8N_DEFAULT_USER_EMAIL=${CD_N8N_USER}
      - N8N_DEFAULT_USER_PASSWORD=${CD_N8N_PASS}
      - N8N_HOST=https://n8n.tigouetheory.com
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.tigouetheory.com/
      - N8N_EDITOR_BASE_URL=https://n8n.tigouetheory.com
      - OLLAMA_HOST=http://cd-service-ollama:11434
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - N8N_RESTRICT_ENVIRONMENT_VARIABLES_ACCESS=false
    volumes:
      - ./CD_VOL_N8N:/home/node/.n8n:z
      - ${CD_STORAGE_PATH}:/data/media:z
      - /usr/local/bin/ffmpeg:/usr/local/bin/ffmpeg:ro
    depends_on:
      cd-service-db:
        condition: service_healthy
    networks:
      - cd-net

  cd-service-ollama:
    image: ollama/ollama:latest
    container_name: cd-service-ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ./CD_VOL_OLLAMA:/root/.ollama:z
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=24h
    networks:
      - cd-net

  # ==========================================
  # faster-whisper Service (Voice Transcription)
  # ==========================================
  # Purpose: Local voice-to-text transcription for Telegram voice notes
  # - Processes voice notes sent to Cyber-Squire bot
  # - Returns transcription for AI routing pipeline
  # - Keeps voice data private (no external API)
  #
  cd-service-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: cd-service-whisper
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./CD_VOL_WHISPER:/root/.cache/huggingface:z
    environment:
      - WHISPER_MODEL=base
      - WHISPER_LANGUAGE=en
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - cd-net

  # ==========================================
  # OpenClaw Gateway (AI Agent - @CDirective_bot)
  # ==========================================
  # Status: RUNNING STANDALONE (not managed by compose)
  # Container: moltbot-gateway (ports 18789, 18790)
  #

  # ==========================================
  # Evolution API (WhatsApp Gateway)
  # ==========================================
  # Purpose: WhatsApp integration via Baileys (personal number)
  # - Provides web UI for QR code scanning at /manager
  # - REST API for sending/receiving messages
  # - Webhooks to n8n for AI-powered responses
  #
  cd-service-evolution:
    image: evoapicloud/evolution-api:latest
    container_name: cd-service-evolution
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_NAME=evolution
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - SERVER_DISABLE_MANAGER=false
      - SERVER_DISABLE_DOCS=false
      - CORS_ORIGIN=*
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${CD_DB_USER}:${CD_DB_PASS}@cd-service-db:5432/evolution_api
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - DATABASE_SAVE_DATA_CONTACTS=true
      - DATABASE_SAVE_DATA_CHATS=true
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - CACHE_LOCAL_TTL=86400
      - AUTHENTICATION_API_KEY=${CD_EVOLUTION_API_KEY}
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=false
      - LOG_LEVEL=ERROR,WARN,INFO,LOG
      - LOG_BAILEYS=error
      - DEL_INSTANCE=false
      - LANGUAGE=en
      - QRCODE_LIMIT=30
      - CONFIG_SESSION_PHONE_CLIENT=CyberSquire
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - WEBHOOK_GLOBAL_URL=http://cd-service-n8n:5678/webhook/whatsapp-incoming
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=false
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      - N8N_ENABLED=false
      - OPENAI_ENABLED=false
      - TYPEBOT_ENABLED=false
      - CHATWOOT_ENABLED=false
      - TELEMETRY_ENABLED=false
    volumes:
      - ./CD_VOL_EVOLUTION:/evolution/instances:z
    depends_on:
      cd-service-db:
        condition: service_healthy
    networks:
      - cd-net

  tunnel-cyber-squire:
    image: cloudflare/cloudflared:latest
    container_name: tunnel-cyber-squire
    network_mode: host
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CD_TUNNEL_TOKEN}

networks:
  cd-net:
    driver: bridge

volumes:
  cd-vol-postgres:
  cd-vol-n8n:
  cd-vol-ollama:
