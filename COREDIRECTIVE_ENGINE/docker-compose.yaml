services:
  cd-service-db:
    image: postgres:16-alpine
    container_name: cd-service-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CD_DB_USER}
      POSTGRES_PASSWORD: ${CD_DB_PASS}
      POSTGRES_DB: ${CD_DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - ./CD_VOL_POSTGRES:/var/lib/postgresql/data:z
      - ./CD_BACKUPS:/backups:z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CD_DB_USER} -d ${CD_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.datadoghq.ad.check_names: '["postgres"]'
      com.datadoghq.ad.init_configs: '[{}]'
      com.datadoghq.ad.instances: '[{"host": "%%host%%", "port": 5432, "username": "%%env_CD_DB_USER%%", "password": "%%env_CD_DB_PASS%%", "dbm": false}]'
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cd-net

  cd-service-n8n:
    image: n8nio/n8n:latest
    container_name: cd-service-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=cd-service-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${CD_DB_NAME}
      - DB_POSTGRESDB_USER=${CD_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${CD_DB_PASS}
      - N8N_ENCRYPTION_KEY=${CD_N8N_KEY}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${CD_N8N_JWT}
      - N8N_DEFAULT_USER_EMAIL=${CD_N8N_USER}
      - N8N_DEFAULT_USER_PASSWORD=${CD_N8N_PASS}
      - N8N_HOST=https://n8n.tigouetheory.com
      - N8N_PROTOCOL=https
      - WEBHOOK_URL=https://n8n.tigouetheory.com/
      - N8N_EDITOR_BASE_URL=https://n8n.tigouetheory.com
      - OLLAMA_HOST=http://cd-service-ollama:11434
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - N8N_RESTRICT_ENVIRONMENT_VARIABLES_ACCESS=false
    volumes:
      - ./CD_VOL_N8N:/home/node/.n8n:z
      - ${CD_STORAGE_PATH}:/data/media:z
      - /usr/local/bin/ffmpeg:/usr/local/bin/ffmpeg:ro
    depends_on:
      cd-service-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2G
          pids: 512
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cd-net

  cd-service-ollama:
    image: ollama/ollama:latest
    container_name: cd-service-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./CD_VOL_OLLAMA:/root/.ollama:z
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=24h
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 3G
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cd-net

  # ==========================================
  # faster-whisper Service (Voice Transcription)
  # ==========================================
  # Purpose: Local voice-to-text transcription for Telegram voice notes
  # - Processes voice notes sent to Cyber-Squire bot
  # - Returns transcription for AI routing pipeline
  # - Keeps voice data private (no external API)
  #
  cd-service-whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: cd-service-whisper
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./CD_VOL_WHISPER:/root/.cache/huggingface:z
    environment:
      - WHISPER_MODEL=base
      - WHISPER_LANGUAGE=en
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cd-net

  # ==========================================
  # OpenClaw Gateway (AI Agent - @CDirective_bot)
  # ==========================================
  # Status: RUNNING STANDALONE (not managed by compose)
  # Container: openclaw-gateway (ports 18789, 18790)
  #

  # ==========================================
  # HashiCorp Vault (Secrets Management)
  # ==========================================
  # Purpose: Centralized secrets management — eliminates hardcoded .env values
  # - AppRole auth for n8n, Keycloak, and services to fetch creds at runtime
  # - Short-lived leases (1hr TTL) for Postgres dynamic credentials
  # - Full audit log of every secret access
  # - Init/unseal MUST be done OFF-STREAM (root token exposed)
  #
  cd-service-vault:
    image: hashicorp/vault:1.15
    container_name: cd-service-vault
    restart: unless-stopped
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    environment:
      - VAULT_ADDR=http://0.0.0.0:8200
      - VAULT_API_ADDR=http://0.0.0.0:8200
    volumes:
      - ./CD_VOL_VAULT/config:/vault/config:z
      - ./CD_VOL_VAULT/data:/vault/data:z
      - ./CD_VOL_VAULT/logs:/vault/logs:z
    command: server -config=/vault/config/vault.hcl
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cd-net

  # ==========================================
  # Keycloak v26 (Identity & SSO)
  # ==========================================
  # Purpose: Centralized identity — SSO for n8n, Vault UI, and future services
  # - Realm: coredirective (imported from CD_VOL_KEYCLOAK_IMPORT)
  # - Roles: cd-admin, cd-operator, cd-auditor
  # - OIDC client for Teleport (Enterprise upgrade path)
  # - Admin password stored in 1Password → Core Infra → "Keycloak Admin"
  # - Upgraded v23 → v26.5.2 (2026-03-11, Phase 08-04)
  # - In production: switch command to `start` (remove start-dev)
  #
  cd-service-keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: cd-service-keycloak
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=${KC_ADMIN_USER}
      - KEYCLOAK_ADMIN_PASSWORD=${KC_ADMIN_PASS}
      - KC_DB=postgres
      - KC_DB_URL=jdbc:postgresql://cd-service-db:5432/${CD_DB_NAME}
      - KC_DB_USERNAME=${CD_DB_USER}
      - KC_DB_PASSWORD=${CD_DB_PASS}
      - KC_HOSTNAME=${KC_HOSTNAME:-localhost}
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - JAVA_OPTS_APPEND=-Xms256m -Xmx512m
    volumes:
      - ./CD_VOL_KEYCLOAK_IMPORT:/opt/keycloak/data/import:ro
    depends_on:
      cd-service-db:
        condition: service_healthy
    command: start-dev --import-realm
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cd-net

  # ==========================================
  # Teleport v18 (SSH Access + Session Recording)
  # ==========================================
  # Purpose: Zero-trust SSH gateway with session recording
  # - All-in-one: auth + proxy + SSH node
  # - Session recording: node-sync (records at the node, syncs to auth)
  # - MFA: TOTP second factor for all users
  # - Foundation for JIT access (08-02) and audit log shipping (08-03)
  # - Admin UI: https://teleport.tigouetheory.com:3080
  #
  cd-service-teleport:
    image: public.ecr.aws/gravitational/teleport-distroless:18.7.2
    container_name: cd-service-teleport
    hostname: teleport.tigouetheory.com
    restart: unless-stopped
    ports:
      - "3080:3080"
      - "3023:3023"
      - "3025:3025"
    volumes:
      - ./CD_VOL_TELEPORT/config:/etc/teleport:ro
      - ./CD_VOL_TELEPORT/data:/var/lib/teleport
    healthcheck:
      test: ["CMD", "/usr/local/bin/tctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cd-net

  # ==========================================
  # Datadog Agent (Observability & Security Signals)
  # ==========================================
  # Purpose: Unified visibility across EC2 + DO K8s — security signals feed from GuardDuty
  # - Collects container logs, process metrics, Docker stats
  # - Security Signals: GuardDuty findings → Datadog (Episode 3 stream demo)
  # - API key in 1Password → Core Infra → "Datadog Core_Automation API Key"
  # Note: pid:host is required for process monitoring (CIS 5.15 accepted risk)
  #
  cd-service-datadog:
    image: datadog/agent:latest
    container_name: cd-service-datadog
    restart: unless-stopped
    pid: host
    environment:
      - DD_API_KEY=${DATADOG_API_KEY}
      - DD_SITE=${DD_SITE:-us5.datadoghq.com}
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE_LOGS=name:cd-service-datadog
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_APM_ENABLED=false
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_HOSTNAME=cd-alpha-engine
      - DD_CONTAINER_LABELS_AS_TAGS=true
      - CD_DB_USER=${CD_DB_USER}
      - CD_DB_PASS=${CD_DB_PASS}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      - ./CD_VOL_DATADOG/conf.d:/etc/datadog-agent/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "agent health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 256
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cd-net

  # ==========================================
  # Falco (Runtime Threat Detection)
  # ==========================================
  # Purpose: Syscall-level monitoring across all containers via modern eBPF
  # - Detects docker exec, privilege escalation, sensitive file reads
  # - Custom per-container rules in CD_VOL_FALCO/rules/
  # - Routes events to Falcosidekick → Datadog
  # Note: Falco needs SYS_ADMIN + apparmor:unconfined, so no-new-privileges
  # is NOT applied (CIS 5.25 accepted risk for this container only)
  #
  cd-service-falco:
    image: falcosecurity/falco:0.43.0
    container_name: cd-service-falco
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - SYS_PTRACE
    volumes:
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - ./CD_VOL_FALCO/config/falco.yaml:/etc/falco/config.d/falco_override.yaml:ro
      - ./CD_VOL_FALCO/rules:/etc/falco/rules.d:ro
      - ./CD_VOL_FALCO/logs:/var/log/falco
    environment:
      - HOST_ROOT=/host
      - FALCO_BPF_PROBE=""
    healthcheck:
      test: ["CMD", "falco", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - apparmor:unconfined
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 128
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      - cd-service-falcosidekick
    networks:
      - cd-net

  # ==========================================
  # Falcosidekick (Event Router)
  # ==========================================
  # Purpose: Routes Falco events to Datadog Events + Logs API
  # - Receives events from Falco via HTTP on port 2801
  # - Forwards to Datadog us5 site
  # - Minimum priority: notice
  #
  cd-service-falcosidekick:
    image: falcosecurity/falcosidekick:2.32.0
    container_name: cd-service-falcosidekick
    restart: unless-stopped
    environment:
      - DATADOG_APIKEY=${DATADOG_API_KEY}
      - DATADOG_HOST=https://api.us5.datadoghq.com
      - DATADOG_MINIMUMPRIORITY=notice
      - DATADOGLOGS_APIKEY=${DATADOG_API_KEY}
      - DATADOGLOGS_HOST=https://http-intake.logs.us5.datadoghq.com/
      - DATADOGLOGS_MINIMUMPRIORITY=notice
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2801/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
          pids: 64
        reservations:
          cpus: '0.05'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cd-net

  # ==========================================
  # Fluentd (Log Router for Teleport Events)
  # ==========================================
  # Purpose: Receives Teleport audit events from Event Handler via mTLS
  # - Forwards to Datadog Logs API (us5 site)
  # - fluent-plugin-datadog installed via custom Dockerfile
  # - mTLS: client_cert_auth for Event Handler connections
  #
  cd-service-fluentd:
    build: ./CD_VOL_FLUENTD
    container_name: cd-service-fluentd
    restart: unless-stopped
    environment:
      - DD_API_KEY=${DATADOG_API_KEY}
    volumes:
      - ./CD_VOL_FLUENTD/fluent.conf:/fluentd/etc/fluent.conf:ro
      - ./CD_VOL_FLUENTD/certs:/etc/fluentd/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "ruby -e \"require 'socket'; TCPSocket.new('127.0.0.1', 8888).close\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cd-net

  # ==========================================
  # Teleport Event Handler (Audit Log Shipper)
  # ==========================================
  # Purpose: Streams Teleport audit events via gRPC to Fluentd
  # - Connects to Teleport auth on port 3025
  # - mTLS client certs for Fluentd connection
  # - Identity file with 1-year TTL (event-handler user)
  # - Events: session.start, session.end, user.login, access_request
  #
  cd-service-teleport-event-handler:
    image: public.ecr.aws/gravitational/teleport-plugin-event-handler:18.7.2
    container_name: cd-service-teleport-event-handler
    restart: unless-stopped
    volumes:
      - ./CD_VOL_TELEPORT_EVENTS/teleport-event-handler.toml:/etc/teleport-event-handler/teleport-event-handler.toml:ro
      - ./CD_VOL_TELEPORT_EVENTS/identity:/etc/teleport-event-handler/identity:ro
      - ./CD_VOL_TELEPORT_EVENTS/certs:/etc/teleport-event-handler/certs:ro
      - ./CD_VOL_TELEPORT_EVENTS/storage:/var/lib/teleport-event-handler/storage
    command: start --config /etc/teleport-event-handler/teleport-event-handler.toml
    depends_on:
      - cd-service-teleport
      - cd-service-fluentd
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cd-net

  tunnel-cyber-squire:
    image: cloudflare/cloudflared:latest
    container_name: tunnel-cyber-squire
    network_mode: host
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CD_TUNNEL_TOKEN}
    healthcheck:
      test: ["CMD", "cloudflared", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
      - /root/.cloudflared
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
          pids: 64
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  cd-net:
    driver: bridge

volumes:
  cd-vol-postgres:
  cd-vol-n8n:
  cd-vol-ollama:
  cd-vol-vault:
  cd-vol-keycloak:
