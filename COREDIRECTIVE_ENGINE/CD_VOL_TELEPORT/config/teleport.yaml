version: v3
teleport:
  nodename: cd-alpha-engine
  data_dir: /var/lib/teleport
  log:
    output: stderr
    severity: INFO

auth_service:
  enabled: true
  listen_addr: 0.0.0.0:3025
  cluster_name: teleport.tigouetheory.com
  session_recording: node-sync
  authentication:
    type: local
    second_factor: otp

proxy_service:
  enabled: true
  listen_addr: 0.0.0.0:3023
  web_listen_addr: 0.0.0.0:3080
  public_addr: teleport.tigouetheory.com:3080
  https_keypairs: []
  acme:
    enabled: false

ssh_service:
  enabled: true
  labels:
    env: production
    role: primary
