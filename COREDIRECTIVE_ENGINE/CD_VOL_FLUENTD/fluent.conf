<source>
  @type http
  port 8888
  bind 0.0.0.0
  <transport tls>
    ca_path /etc/fluentd/certs/ca.crt
    cert_path /etc/fluentd/certs/server.crt
    private_key_path /etc/fluentd/certs/server.key
    client_cert_auth true
  </transport>
  <parse>
    @type json
  </parse>
</source>

<match test.log>
  @type datadog
  @id teleport_events
  api_key "#{ENV['DD_API_KEY']}"
  host http-intake.logs.us5.datadoghq.com
  dd_source teleport
  dd_tags "env:production,service:teleport,team:coredirective"
</match>

<match session>
  @type datadog
  @id teleport_sessions
  api_key "#{ENV['DD_API_KEY']}"
  host http-intake.logs.us5.datadoghq.com
  dd_source teleport
  dd_tags "env:production,service:teleport-sessions,team:coredirective"
</match>
