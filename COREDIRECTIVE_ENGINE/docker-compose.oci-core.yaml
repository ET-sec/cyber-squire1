# ============================================================================
# OCI CORE STACK: the minimal live environment on Oracle Ampere A1 (ARM)
# ============================================================================
# This is the subset the OCI host carries as of 2026-09-15: the database, n8n,
# the tunnel, the stateless set (Falco, Falcosidekick, the Datadog agent,
# Whisper, Ollama) and the identity tier (Vault, Keycloak, Teleport, its event
# handler, Vector). The master docker-compose.yaml is the definition of record.
#
# DESIGN NOTES (differences from the master docker-compose.yaml, on purpose):
#   - Images are pinned tag@digest (re-pinned 2026-09-06). The digest is the
#     multi-arch INDEX digest (amd64 + arm64 verified in the registry), so
#     Docker still resolves the arm64 layer on this host and Renovate tracks
#     the same receipt it tracks in the master file.
#   - Limits (cpus, memory, pids) match the master file per service. The
#     tunnel runs read-only with tmpfs for /tmp and the nonroot home, same
#     as the master file (image user is 65532, not root).
#   - Secrets come from `env_file: stack.env` using the CONTAINER'S target var
#     names (POSTGRES_USER, N8N_ENCRYPTION_KEY, TUNNEL_TOKEN, ...), NOT compose
#     ${VAR} interpolation. The n8n keys contain `$`, which compose corrupts.
#     env_file passes values literally. Generate stack.env from Doppler; it is
#     chmod 600 on the host and never committed. See stack.env.template.
#   - n8n data dir must be chown 1000:1000 on the host (n8n runs as uid 1000).
#   - Tunnel is token-based; its ingress routing is Terraform (tunnel_ingress.tf
#     in the edge root) and it reconnects automatically wherever cloudflared runs.
#
# DEPLOY:
#   The host runs this file as /opt/coredirective/docker-compose.yaml (the
#   compose project's config file), so copy it there under that name:
#   scp this to host:~/ ; ssh host 'sudo install -m 644 ~/<file> \
#             /opt/coredirective/docker-compose.yaml && cd /opt/coredirective \
#             && sudo docker compose up -d'
#   up -d recreates only the containers whose definition changed. Recreating
#   the tunnel drops an SSH session that rides the tunnel, so run that step
#   detached (setsid) or from an allowlisted range.
# VERIFY:  curl -s -o /dev/null -w '%{http_code}' https://<your-edge-hostname>
#          -> 302 (Cloudflare Access gate in front of a live origin) = success
# ============================================================================
name: coredirective
services:
  cd-service-db:
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: cd-service-db
    restart: unless-stopped
    env_file: [ stack.env ]
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - ./CD_VOL_POSTGRES:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: [ "no-new-privileges:true" ]
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
          pids: 256
    networks: [ net-core ]

  cd-service-n8n:
    image: n8nio/n8n:2.17.5@sha256:81dc967a062bf267d6aa827e5dfb492ce80e366e77f3b8051c07970a653fb69a
    container_name: cd-service-n8n
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    env_file: [ stack.env ]
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=cd-service-db
      - DB_POSTGRESDB_PORT=5432
      # N8N_HOST, WEBHOOK_URL, N8N_EDITOR_BASE_URL come from stack.env:
      # the edge hostname is deployment-specific and stays out of the repo.
      - N8N_PROTOCOL=https
      - N8N_RESTRICT_ENVIRONMENT_VARIABLES_ACCESS=true
    volumes:
      - ./CD_VOL_N8N:/home/node/.n8n
    depends_on:
      cd-service-db:
        condition: service_healthy
    security_opt: [ "no-new-privileges:true" ]
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2G
          pids: 512
    networks: [ net-core, net-ai ]

  tunnel-cyber-squire:
    image: cloudflare/cloudflared:2026.3.0@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
    container_name: tunnel-cyber-squire
    network_mode: host
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    env_file: [ stack.env ]
    read_only: true
    tmpfs:
      - /tmp
      - /home/nonroot/.cloudflared
    security_opt: [ "no-new-privileges:true" ]
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
          pids: 64

  # --------------------------------------------------------------------------
  # The stateless set (added 2026-09-08). Same images, index
  # digests, and limits as the master file (Ollama memory raised, see below).
  # Falco and the Datadog agent carry the documented accepted risks (CIS 5.25
  # and 5.15: SYS_ADMIN, host pid, read-only container socket). Off-host
  # credentials live in monitoring.env (DD_API_KEY, DD_SITE, DATADOG_APIKEY,
  # DATADOG_HOST, DATADOGLOGS_APIKEY, DATADOGLOGS_HOST), chmod 600, read only
  # by the two services that ship to the SIEM. The sealed network has no route
  # out, so model weights are pulled once through a throwaway container on the
  # default bridge into the same volume (runbook step in the PR description).
  # --------------------------------------------------------------------------
  cd-service-ollama:
    image: ollama/ollama@sha256:684d8674b4315fa18f4f0e973a118ec2652ed96f67563277839985175858e0ba   # 0.34.0 (2026-09-05). Re-pinned 2026-09-10: 0.17.7 estimated 8.0 GiB for qwen3.5:9b and refused to load it under the 8G cap; 0.34.0 measured 5.9 GiB resident on this host and is the build the model benchmark ran on
    container_name: cd-service-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./CD_VOL_OLLAMA:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1        # one inference at a time; a second request queues instead of doubling memory and CPU
      - OLLAMA_MAX_LOADED_MODELS=1   # the 9B alone fills the cap; a second model waits for the first to unload
    security_opt: [ "no-new-privileges:true" ]
    cpu_shares: 512   # half the default weight: all four cores when the box is idle, yields to n8n and Postgres under contention
    deploy:
      resources:
        limits:
          cpus: '4.00'   # every core on the host. qwen3.5 re-reads its prompt each turn (hybrid attention, no prefix reuse in llama.cpp yet), so cores are the latency lever: measured 2026-09-10 at 2 cores 85 to 106 s per tool call, at 4 cores 46 to 57 s
          memory: 8G     # qwen3.5:9b is 5.9 GiB resident at 8k context; 7.25 GiB was the peak seen across the 2026-09-10 benchmark. A blowout kills this container only
          pids: 256
    networks: [ net-ai ]

  cd-service-whisper:
    image: fedirz/faster-whisper-server:0.5.0-cpu@sha256:760e5e43d427dc6cfbbc4731934b908b7de9c7e6d5309c6a1f0c8c923a5b6030
    container_name: cd-service-whisper
    restart: unless-stopped
    # The image's CMD is `uv run uvicorn ...`, which resolves build deps from the
    # package index at every start and cannot on the sealed network. Run the
    # venv's uvicorn directly; the model cache is warmed once (PR description).
    command: ["/root/faster-whisper-server/.venv/bin/uvicorn", "--factory", "faster_whisper_server.main:create_app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./CD_VOL_WHISPER:/root/.cache/huggingface
    environment:
      # Setting names the 0.5.0 image reads; the master file's WHISPER_MODEL has no effect here.
      - WHISPER__MODEL=Systran/faster-whisper-small
      - WHISPER__INFERENCE_DEVICE=cpu
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    security_opt: [ "no-new-privileges:true" ]
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 2G   # the master's 1G is OOM-killed loading the small model on this host (exit 137, 2026-09-08)
          pids: 256
    networks: [ net-ai ]

  cd-service-falcosidekick:
    image: falcosecurity/falcosidekick:2.32.0@sha256:1976da72151850aae4436f33a5ed94bdef469f42a9b61c182b4feeb5441fb081
    container_name: cd-service-falcosidekick
    restart: unless-stopped
    env_file: [ monitoring.env ]
    environment:
      - DATADOG_MINIMUMPRIORITY=notice
      - DATADOGLOGS_MINIMUMPRIORITY=notice
      # falcosidekick-customfields.yaml: every alert carries the sensor's
      # agent_id so detection events share the dashboards' agent dimension.
      - CUSTOMFIELDS=stack:coredirective,agent_id:falco_sensor
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:2801/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    read_only: true
    tmpfs:
      - /tmp
    security_opt: [ "no-new-privileges:true" ]
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
          pids: 64
    networks: [ net-monitoring ]

  cd-service-falco:
    image: falcosecurity/falco:0.43.0@sha256:88c01fa17bcc03c990a2691d08e7d43d746e32b07dbe9c6eb77bfdb3646cec41
    container_name: cd-service-falco
    restart: unless-stopped
    # Modern eBPF probe: no kernel module, needs the capabilities below and no
    # AppArmor confinement. Accepted risk CIS 5.25; the one service without
    # no-new-privileges.
    cap_drop: [ ALL ]
    cap_add: [ SYS_ADMIN, SYS_RESOURCE, SYS_PTRACE ]
    volumes:
      - /sys/kernel/tracing:/sys/kernel/tracing:ro
      - /var/run/docker.sock:/host/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /etc:/host/etc:ro
      - ./CD_VOL_FALCO/config/falco.yaml:/etc/falco/config.d/falco_override.yaml:ro
      - ./CD_VOL_FALCO/rules:/etc/falco/rules.d:ro
      - ./CD_VOL_FALCO/logs:/var/log/falco
    environment:
      - HOST_ROOT=/host
    healthcheck:
      test: ["CMD", "falco", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt: [ "apparmor:unconfined" ]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 128
    depends_on:
      - cd-service-falcosidekick
    networks: [ net-monitoring ]

  cd-service-datadog:
    image: datadog/agent:7.78.0@sha256:506c580f21aa53830b47a7ea161760d9a088ed689d17a85521b4138695a9ee59
    container_name: cd-service-datadog
    restart: unless-stopped
    # Host pid and the read-only container socket are the agent's documented
    # accepted risk (CIS 5.15). No database credentials: nothing here uses them.
    pid: host
    env_file: [ monitoring.env ]
    environment:
      - DD_LOGS_ENABLED=true
      - DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL=true
      - DD_CONTAINER_EXCLUDE_LOGS=name:cd-service-datadog
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_APM_ENABLED=false
      - DD_PROCESS_AGENT_ENABLED=true
      - DD_HOSTNAME=cd-engine
      - DD_CONTAINER_LABELS_AS_TAGS=true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /etc/os-release:/host/etc/os-release:ro
      - /var/log:/host/var/log:ro
      # /conf.d is the image's drop-in path: the entrypoint copies it over the
      # defaults. Mounting /etc/datadog-agent/conf.d directly (the master file)
      # would replace the built-in check configs, so this file mounts /conf.d.
      - ./CD_VOL_DATADOG/conf.d:/conf.d:ro
    healthcheck:
      test: ["CMD-SHELL", "agent health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt: [ "no-new-privileges:true" ]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 256
    networks: [ net-monitoring ]

  # --------------------------------------------------------------------------
  # The identity tier (added 2026-09-15): the secrets manager, the identity
  # provider, the access gateway, its event handler, and the audit log shipper.
  # Same images and limits as the master file, index digests re-resolved on this
  # host. Deployment identifiers and secrets come from identity.env (the seal key
  # id and the KMS endpoints, the identity provider's bootstrap admin and database
  # values, its public hostname, the gateway's address), chmod 600, read only by
  # these blocks; the shipper reads its SIEM key from monitoring.env.
  # --------------------------------------------------------------------------
  cd-service-vault:
    image: hashicorp/vault:2.1.0@sha256:5520cc26271c024e6ffa45cdf95255bd26b70d71ba4b7e0bc18925bef4128adb
    container_name: cd-service-vault
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8200"
    # VAULT_OCIKMS_SEAL_KEY_ID, VAULT_OCIKMS_CRYPTO_ENDPOINT and
    # VAULT_OCIKMS_MANAGEMENT_ENDPOINT come from identity.env: the seal reads
    # them, and vault.hcl is the single configuration source.
    env_file: [ identity.env ]
    environment:
      - VAULT_ADDR=http://127.0.0.1:8200
      - SKIP_SETCAP=true   # mlock is disabled in vault.hcl, so no IPC_LOCK is granted
    volumes:
      - ./CD_VOL_VAULT/config/vault.hcl:/vault/config/vault.hcl:ro
      - ./CD_VOL_VAULT/data:/vault/data
      - ./CD_VOL_VAULT/logs:/vault/logs
    command: server
    healthcheck:
      # 200 only when initialized, unsealed and active: a sealed server reads unhealthy
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8200/v1/sys/health?standbyok=true"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt: [ "no-new-privileges:true" ]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
          pids: 128
    networks: [ net-core ]

  cd-service-keycloak:
    image: quay.io/keycloak/keycloak:26.7.3@sha256:29be7252db0a106f1cd2ac17b9a56ff2668073da645638a38b9fc67deeb2d6c4
    container_name: cd-service-keycloak
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    # KC_BOOTSTRAP_ADMIN_USERNAME, KC_BOOTSTRAP_ADMIN_PASSWORD, KC_DB_URL,
    # KC_DB_USERNAME, KC_DB_PASSWORD and KC_HOSTNAME come from identity.env.
    env_file: [ identity.env ]
    environment:
      - KC_DB=postgres
      - KC_DB_SCHEMA=keycloak   # its own schema in the shared database
      - KC_HOSTNAME_STRICT=true
      - KC_PROXY_HEADERS=xforwarded   # scheme and host from the terminating tunnel
      - KC_HTTP_ENABLED=true          # production mode disables the plain listener otherwise
      - KC_HEALTH_ENABLED=true
      - JAVA_OPTS_APPEND=-Xms256m -Xmx640m   # appends; JAVA_OPTS would replace the image's option set
    volumes:
      - ./CD_VOL_KEYCLOAK_IMPORT:/opt/keycloak/data/import:ro
    depends_on:
      cd-service-db:
        condition: service_healthy
    command: start
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"UP\"' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    security_opt: [ "no-new-privileges:true" ]
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 1G
          pids: 256
    networks: [ net-core ]

  cd-service-teleport:
    image: public.ecr.aws/gravitational/teleport-distroless:18.11.0@sha256:66a368cd1c480a9261c5271a410bd9a3ea159401f8633c2942523284a80c32c4
    container_name: cd-service-teleport
    restart: unless-stopped
    ports:
      - "127.0.0.1:3080:3080"
      - "127.0.0.1:3023:3023"
      - "127.0.0.1:3025:3025"
    volumes:
      - ./CD_VOL_TELEPORT/config:/etc/teleport:ro
      - ./CD_VOL_TELEPORT/data:/var/lib/teleport
    healthcheck:
      test: ["CMD", "/usr/local/bin/tctl", "status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt: [ "no-new-privileges:true" ]
    deploy:
      resources:
        limits:
          cpus: '1.00'
          memory: 512M
          pids: 256
    networks: [ net-core ]

  cd-service-vector:
    image: timberio/vector:0.58.0-distroless-static@sha256:f41132f3675185e4b63ef608ba3d6b6406727d8fe57169c495696ac610a7d1dc
    container_name: cd-service-vector
    restart: unless-stopped
    env_file: [ monitoring.env ]   # DD_API_KEY and DD_SITE, the same file the monitoring agent reads
    environment:
      # 0.58 refuses to expand ${VAR} in its configuration unless told to; the
      # API key and the site are the only values vector.yaml reads that way
      - VECTOR_DANGEROUSLY_ALLOW_ENV_VAR_INTERPOLATION=true
    volumes:
      - ./CD_VOL_VECTOR/vector.yaml:/etc/vector/vector.yaml:ro
      - ./CD_VOL_TELEPORT_EVENTS/certs/ca.crt:/etc/vector/certs/ca.crt:ro
      - ./CD_VOL_TELEPORT_EVENTS/certs/server.crt:/etc/vector/certs/server.crt:ro
      - ./CD_VOL_TELEPORT_EVENTS/certs/server.key:/etc/vector/certs/server.key:ro
    healthcheck:
      # the only binary in the image; validates the configuration it runs
      test: ["CMD", "vector", "validate", "--skip-healthchecks", "/etc/vector/vector.yaml"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 20s
    security_opt: [ "no-new-privileges:true" ]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
          pids: 128
    # net-core as well as net-monitoring: the health scrape of the exporter on
    # 9598 runs from the orchestration engine's container, which lives on net-core
    networks: [ net-core, net-monitoring ]

  cd-service-teleport-event-handler:
    image: public.ecr.aws/gravitational/teleport-plugin-event-handler:18.11.0@sha256:68dec7230299b106b45ab897d85ad843bb4df8c863c3ba63ef2debbf51e3ae64
    container_name: cd-service-teleport-event-handler
    restart: unless-stopped
    volumes:
      - ./CD_VOL_TELEPORT_EVENTS/teleport-event-handler.toml:/etc/teleport-event-handler/teleport-event-handler.toml:ro
      - ./CD_VOL_TELEPORT_EVENTS/identity:/etc/teleport-event-handler/identity:ro
      - ./CD_VOL_TELEPORT_EVENTS/certs:/etc/teleport-event-handler/certs:ro
      - ./CD_VOL_TELEPORT_EVENTS/storage:/var/lib/teleport-event-handler/storage
    command: start --config /etc/teleport-event-handler/teleport-event-handler.toml
    depends_on:
      - cd-service-teleport
      - cd-service-vector
    security_opt: [ "no-new-privileges:true" ]
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
          pids: 128
    networks: [ net-core, net-monitoring ]

networks:
  net-core:
    name: net-core
  net-ai:
    name: net-ai
    internal: true   # sealed: no route in or out; n8n, Ollama, Whisper only
  net-monitoring:
    name: net-monitoring
