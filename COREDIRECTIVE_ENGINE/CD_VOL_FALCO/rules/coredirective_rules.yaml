# =============================================================================
# CoreDirective Custom Falco Rules
# =============================================================================
# Per-container runtime threat detection rules for all services
# Tags: [coredirective, security, <container>, <threat-type>]
# =============================================================================

# ---------------------------------------------------------------------------
# Macros (reusable conditions)
# ---------------------------------------------------------------------------
- macro: cd_container
  condition: (container.name startswith "cd-service-" or container.name = "tunnel-cyber-squire" or container.name = "openclaw-gateway")

- macro: is_postgres
  condition: (container.name = "cd-service-db")

- macro: is_n8n
  condition: (container.name = "cd-service-n8n")

- macro: is_vault
  condition: (container.name = "cd-service-vault")

- macro: is_tunnel
  condition: (container.name = "tunnel-cyber-squire")

- macro: is_keycloak
  condition: (container.name = "cd-service-keycloak")

- macro: is_datadog
  condition: (container.name = "cd-service-datadog")

- macro: is_falco
  condition: (container.name = "cd-service-falco")

- macro: is_openclaw
  condition: (container.name = "openclaw-gateway")

- macro: sensitive_files
  condition: (fd.name startswith /etc/shadow or fd.name startswith /etc/passwd or fd.name startswith /etc/gshadow)

# ---------------------------------------------------------------------------
# PostgreSQL (cd-service-db)
# ---------------------------------------------------------------------------

- rule: CD PostgreSQL Shell Access
  desc: Detect exec/shell spawning inside PostgreSQL container (excludes healthcheck)
  condition: >
    spawned_process and is_postgres
    and proc.name in (bash, sh, dash, csh, zsh, ash)
    and proc.pname != postgres
    and not proc.cmdline contains "pg_isready"
  output: >
    CRITICAL shell access in PostgreSQL container
    (time=%evt.time container=%container.name id=%container.id
    proc=%proc.name parent=%proc.pname user=%user.name
    cmdline=%proc.cmdline terminal=%proc.tty)
  priority: CRITICAL
  tags: [coredirective, security, postgresql, container-exec]
  source: syscall

- rule: CD PostgreSQL Config Read
  desc: Detect reads of PostgreSQL configuration files
  condition: >
    open_read and is_postgres
    and (fd.name endswith pg_hba.conf or fd.name endswith postgresql.conf)
    and proc.name != postgres
  output: >
    WARNING PostgreSQL config file read by non-postgres process
    (time=%evt.time container=%container.name proc=%proc.name
    user=%user.name file=%fd.name)
  priority: WARNING
  tags: [coredirective, security, postgresql, config-access]
  source: syscall

- rule: CD PostgreSQL Unexpected Outbound
  desc: Detect outbound network connections from PostgreSQL container to public IPs
  condition: >
    evt.type = connect
    and is_postgres
    and fd.typechar = 4
    and fd.l4proto = tcp
    and fd.rip != "127.0.0.1"
    and fd.rip != "0.0.0.0"
  output: >
    ERROR outbound TCP connection from PostgreSQL container
    (time=%evt.time container=%container.name proc=%proc.name
    user=%user.name connection=%fd.name)
  priority: NOTICE
  tags: [coredirective, security, postgresql, network-anomaly]
  source: syscall

- rule: CD PostgreSQL Write Outside Data Dir
  desc: Detect writes outside expected paths in PostgreSQL container
  condition: >
    (evt.type in (open, openat, openat2) and evt.is_open_write = true)
    and is_postgres
    and not fd.name startswith /var/lib/postgresql/data
    and not fd.name startswith /tmp
    and not fd.name startswith /run
    and not fd.name startswith /proc
    and not fd.name startswith /dev/shm
    and not fd.name startswith base/
    and not fd.name startswith global/
    and not fd.name startswith pg_
    and proc.name = postgres
  output: >
    WARNING PostgreSQL writing outside expected paths
    (time=%evt.time container=%container.name proc=%proc.name
    user=%user.name file=%fd.name)
  priority: WARNING
  tags: [coredirective, security, postgresql, filesystem-anomaly]
  source: syscall

# ---------------------------------------------------------------------------
# n8n (cd-service-n8n)
# ---------------------------------------------------------------------------

- rule: CD n8n Shell Spawn
  desc: Detect shell spawning in n8n container (n8n has executeCommand -- monitor but allow)
  condition: >
    spawned_process and is_n8n
    and proc.name in (bash, sh, dash, csh, zsh, ash)
  output: >
    NOTICE shell spawned in n8n container (may be executeCommand)
    (time=%evt.time container=%container.name proc=%proc.name
    parent=%proc.pname user=%user.name cmdline=%proc.cmdline)
  priority: NOTICE
  tags: [coredirective, security, n8n, shell-spawn]
  source: syscall

- rule: CD n8n Sensitive File Read
  desc: Detect reads of /etc/shadow or /etc/passwd in n8n container
  condition: >
    open_read and is_n8n and sensitive_files
  output: >
    CRITICAL sensitive file read in n8n container
    (time=%evt.time container=%container.name proc=%proc.name
    user=%user.name file=%fd.name)
  priority: CRITICAL
  tags: [coredirective, security, n8n, credential-access]
  source: syscall

- rule: CD n8n Unexpected Binary
  desc: Detect unexpected binary execution in n8n container
  condition: >
    spawned_process and is_n8n
    and proc.name in (wget, curl, nc, ncat, nmap, python, python3, perl, ruby, gcc, cc, ld)
    and proc.pname != node
  output: >
    WARNING unexpected binary executed in n8n container
    (time=%evt.time container=%container.name proc=%proc.name
    parent=%proc.pname user=%user.name cmdline=%proc.cmdline)
  priority: WARNING
  tags: [coredirective, security, n8n, suspicious-binary]
  source: syscall

# ---------------------------------------------------------------------------
# HashiCorp Vault (cd-service-vault)
# ---------------------------------------------------------------------------

- rule: CD Vault Shell Access
  desc: Detect any exec into Vault container
  condition: >
    spawned_process and is_vault
    and proc.name in (bash, sh, dash, csh, zsh, ash)
  output: >
    CRITICAL shell access in Vault container
    (time=%evt.time container=%container.name proc=%proc.name
    parent=%proc.pname user=%user.name cmdline=%proc.cmdline
    terminal=%proc.tty)
  priority: CRITICAL
  tags: [coredirective, security, vault, container-exec]
  source: syscall

- rule: CD Vault Unseal Key Access
  desc: Detect reads of vault unseal key or root token paths
  condition: >
    open_read and is_vault
    and (fd.name contains unseal or fd.name contains root-token or fd.name contains recovery)
  output: >
    EMERGENCY vault unseal/root-token file access detected
    (time=%evt.time container=%container.name proc=%proc.name
    user=%user.name file=%fd.name)
  priority: EMERGENCY
  tags: [coredirective, security, vault, unseal-key-access]
  source: syscall

- rule: CD Vault Unexpected File Write
  desc: Detect unexpected file writes in Vault data directory
  condition: >
    (evt.type in (open, openat, openat2) and evt.is_open_write = true)
    and is_vault
    and fd.name startswith /vault/data
    and proc.name != vault
  output: >
    ERROR unexpected write to Vault data by non-vault process
    (time=%evt.time container=%container.name proc=%proc.name
    user=%user.name file=%fd.name)
  priority: ERROR
  tags: [coredirective, security, vault, data-tampering]
  source: syscall

# ---------------------------------------------------------------------------
# Cloudflare Tunnel (tunnel-cyber-squire)
# ---------------------------------------------------------------------------

- rule: CD Tunnel Shell Access
  desc: Detect any exec into Cloudflare Tunnel container
  condition: >
    spawned_process and is_tunnel
    and proc.name in (bash, sh, dash, csh, zsh, ash)
  output: >
    CRITICAL shell access in Cloudflare Tunnel container
    (time=%evt.time container=%container.name proc=%proc.name
    parent=%proc.pname user=%user.name cmdline=%proc.cmdline)
  priority: CRITICAL
  tags: [coredirective, security, tunnel, container-exec]
  source: syscall

- rule: CD Tunnel File Modification
  desc: Detect file modifications in Cloudflare Tunnel container
  condition: >
    (evt.type in (open, openat, openat2) and evt.is_open_write = true)
    and is_tunnel
    and not fd.name startswith /tmp
    and not fd.name startswith /proc
    and not fd.name startswith /dev
  output: >
    ERROR file modification in Cloudflare Tunnel container
    (time=%evt.time container=%container.name proc=%proc.name
    user=%user.name file=%fd.name)
  priority: ERROR
  tags: [coredirective, security, tunnel, file-modification]
  source: syscall

