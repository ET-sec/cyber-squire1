# ---------------------------------------------------------------------------
# Datadog Agent (cd-service-datadog)
# ---------------------------------------------------------------------------

- rule: CD Datadog Unexpected Binary
  desc: Detect unexpected binary execution in Datadog Agent container
  condition: >
    spawned_process and is_datadog
    and proc.name in (wget, curl, nc, ncat, python, python3, perl, gcc)
    and proc.pname != agent
    and proc.pname != process-agent
    and proc.pname != trace-agent
    and proc.pname != security-agent
  output: >
    WARNING unexpected binary executed in Datadog Agent container
    (time=%evt.time container=%container.name proc=%proc.name
    parent=%proc.pname user=%user.name cmdline=%proc.cmdline)
  priority: WARNING
  tags: [coredirective, security, datadog, suspicious-binary]
  source: syscall

- rule: CD Datadog Unexpected Write
  desc: Detect writes in Datadog Agent container outside expected paths
  condition: >
    (evt.type in (open, openat, openat2) and evt.is_open_write = true)
    and is_datadog
    and not fd.name startswith /tmp
    and not fd.name startswith /opt/datadog-agent
    and not fd.name startswith /var/log
    and not fd.name startswith /proc
    and not fd.name startswith /dev
    and not fd.name startswith /run
  output: >
    WARNING unexpected write in Datadog Agent container
    (time=%evt.time container=%container.name proc=%proc.name
    user=%user.name file=%fd.name)
  priority: WARNING
  tags: [coredirective, security, datadog, filesystem-anomaly]
  source: syscall

# ---------------------------------------------------------------------------
# Falco Self-Monitoring (cd-service-falco)
# ---------------------------------------------------------------------------

- rule: CD Falco Shell Access
  desc: Detect exec into Falco container itself
  condition: >
    spawned_process and is_falco
    and proc.name in (bash, sh, dash, csh, zsh, ash)
  output: >
    CRITICAL shell access in Falco container (self-monitoring alert)
    (time=%evt.time container=%container.name proc=%proc.name
    parent=%proc.pname user=%user.name cmdline=%proc.cmdline)
  priority: CRITICAL
  tags: [coredirective, security, falco, container-exec, self-monitoring]
  source: syscall

- rule: CD Falco Rule File Modification
  desc: Detect runtime modification of Falco rule files
  condition: >
    (evt.type in (open, openat, openat2) and evt.is_open_write = true)
    and is_falco
    and (fd.name startswith /etc/falco or fd.name contains rules)
  output: >
    EMERGENCY Falco rule files modified at runtime (possible tampering)
    (time=%evt.time container=%container.name proc=%proc.name
    user=%user.name file=%fd.name)
  priority: EMERGENCY
  tags: [coredirective, security, falco, rule-tampering, self-monitoring]
  source: syscall

