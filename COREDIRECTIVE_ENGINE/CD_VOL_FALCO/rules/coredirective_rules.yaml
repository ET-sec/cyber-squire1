# ---------------------------------------------------------------------------
# General Rules (all CoreDirective containers)
# ---------------------------------------------------------------------------

- rule: CD Privilege Escalation Attempt
  desc: Detect setuid/setgid calls in any CoreDirective container
  condition: >
    evt.type in (setuid, setgid, setresuid, setresgid)
    and cd_container
    and not proc.name in (su, sudo, login, sshd, cron, vault, postgres)
  output: >
    CRITICAL privilege escalation attempt in container
    (time=%evt.time container=%container.name proc=%proc.name
    parent=%proc.pname user=%user.name uid=%user.uid evt=%evt.type)
  priority: CRITICAL
  tags: [coredirective, security, privilege-escalation]
  source: syscall

- rule: CD Etc Directory Modification
  desc: Detect modification of /etc/ files in any CoreDirective container
  condition: >
    (evt.type in (open, openat, openat2) and evt.is_open_write = true)
    and cd_container
    and fd.name startswith /etc/
    and not fd.name startswith /etc/datadog-agent
    and not proc.name in (vault, postgres)
  output: >
    ERROR /etc/ directory modification in container
    (time=%evt.time container=%container.name proc=%proc.name
    user=%user.name file=%fd.name)
  priority: ERROR
  tags: [coredirective, security, etc-modification]
  source: syscall

- rule: CD Sensitive File Read Any Container
  desc: Detect reads of /etc/shadow from any CoreDirective container
  condition: >
    open_read and cd_container
    and fd.name startswith /etc/shadow
  output: >
    CRITICAL /etc/shadow read detected in container
    (time=%evt.time container=%container.name proc=%proc.name
    parent=%proc.pname user=%user.name file=%fd.name)
  priority: CRITICAL
  tags: [coredirective, security, credential-access]
  source: syscall

- rule: CD Docker Exec Detected
  desc: Detect docker exec into any CoreDirective container
  condition: >
    spawned_process and cd_container
    and proc.tty != 0
    and proc.pname = runc
  output: >
    CRITICAL docker exec detected into container
    (time=%evt.time container=%container.name proc=%proc.name
    parent=%proc.pname user=%user.name cmdline=%proc.cmdline
    terminal=%proc.tty)
  priority: CRITICAL
  tags: [coredirective, security, docker-exec]
  source: syscall
