# =============================================================================
# Falco Configuration Overlay — CoreDirective Engine
# =============================================================================
# Mounted into /etc/falco/config.d/ to override specific default settings
# Default falco.yaml remains intact (preserves plugin definitions)
# Custom rules loaded automatically from /etc/falco/rules.d/
# =============================================================================

json_output: true
json_include_output_property: true
json_include_tags_property: true

# Route events to Falcosidekick
http_output:
  enabled: true
  url: http://cd-service-falcosidekick:2801/
  user_agent: "falco/0.43.0"

# File output for local backup/debugging
file_output:
  enabled: true
  keep_alive: true
  filename: /var/log/falco/events.json

# Stdout for container logs (captured by Datadog agent)
stdout_output:
  enabled: true
syslog_output:
  enabled: false

# Engine configuration — modern eBPF (no kernel module needed)
engine:
  kind: modern_ebpf
  modern_ebpf:
    cpus_for_each_buffer: 2
    buf_size_preset: 4
    drop_failed_exit: false

# Metrics for self-monitoring
metrics:
  enabled: true
  interval: 30s
  output_rule: true

# Watch config files for changes (reload without restart)
watch_config_files: true

# Log level
log_level: info
