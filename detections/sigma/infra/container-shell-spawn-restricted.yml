title: Shell Spawn in Restricted Container
id: a1c43f1b-9e2c-4f04-8de4-2b6a52a5b711
status: stable
description: |
  Detects an interactive shell spawned inside a container whose runtime profile
  forbids shell access. Containers covered include the database, Vault, the
  Cloudflare Tunnel sidecar, Keycloak, the Falco daemon, and the OpenClaw
  gateway. None of these services should ever exec a shell during normal
  operation. Healthcheck commands like pg_isready are excluded.
references:
  - https://attack.mitre.org/techniques/T1059/
  - https://falco.org/docs/rules/
  - https://github.com/ET-sec/cyber-squire1/blob/main/docs/grc/AI_AUDIT_TRAIL_SPEC.md
author: Organization Security Engineering
date: 2026-04-24
tags:
  - attack.execution
  - attack.t1059
  - cd.container
  - falco.parity
logsource:
  category: process_creation
  product: linux
detection:
  selection_shells:
    Image|contains:
      - 'svc-db'
      - 'svc-vault'
      - 'svc-tunnel'
      - 'svc-keycloak'
      - 'svc-falco'
      - 'svc-openclaw'
    Image|startswith: 'svc-'
    Process:
      - bash
      - sh
      - dash
      - zsh
      - ash
      - csh
  filter_healthcheck:
    CommandLine|contains:
      - 'pg_isready'
      - 'wget --spider'
      - 'healthcheck'
  condition: selection_shells and not filter_healthcheck
falsepositives:
  - Authorized incident response when an operator has opened a session under change control. Suppress for the duration of the change window.
  - Container image rebuilds that include a shell entrypoint (rare; tracked under change management).
level: high
