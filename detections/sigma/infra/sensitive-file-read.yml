title: Sensitive Credential File Read in Application Container
id: 5f1f4e5c-78cb-4a7e-9d8c-3b9e1142a5d7
status: stable
description: |
  Detects reads of /etc/shadow, /etc/passwd, /etc/sudoers, or SSH host keys
  inside an application container. Application containers do not require
  access to these files during normal operation.
references:
  - https://attack.mitre.org/techniques/T1003/008/
  - https://github.com/ET-sec/cyber-squire1/blob/main/docs/grc/AI_AUDIT_TRAIL_SPEC.md
author: Organization Security Engineering
date: 2026-04-24
tags:
  - attack.credential_access
  - attack.t1003.008
  - falco.parity
logsource:
  category: file_event
  product: linux
detection:
  selection_files:
    TargetFilename|contains:
      - '/etc/shadow'
      - '/etc/passwd-'
      - '/etc/sudoers'
      - '/.ssh/id_rsa'
      - '/.ssh/id_ed25519'
      - '/.ssh/authorized_keys'
  selection_app_container:
    Image|startswith: 'svc-'
  filter_system_processes:
    Process:
      - 'getent'
      - 'systemd'
      - 'login'
  condition: selection_files and selection_app_container and not filter_system_processes
falsepositives:
  - Image rebuilds that legitimately ship login utilities. Track in change management.
level: high
