title: Privilege Escalation Attempt In Application Container
id: 2f9b9a14-87b9-4c61-b1c1-3a2f63ab10aa
status: stable
description: |
  Detects setuid binary execution, sudo invocation, or capability escalation
  attempts inside an application container. The container runtime profile sets
  no_new_privileges and runs as a non root user; any escalation attempt is a
  strong indicator of an intrusion in progress.
references:
  - https://attack.mitre.org/techniques/T1068/
  - https://github.com/ET-sec/cyber-squire1/blob/main/docs/grc/AI_AUDIT_TRAIL_SPEC.md
author: Organization Security Engineering
date: 2026-04-24
tags:
  - attack.privilege_escalation
  - attack.t1068
  - falco.parity
logsource:
  category: process_creation
  product: linux
detection:
  selection_container:
    Image|startswith: 'svc-'
  selection_escalation:
    Process:
      - sudo
      - su
      - chmod
      - setcap
    CommandLine|contains:
      - '+s'
      - 'cap_'
      - '/bin/su'
  condition: selection_container and selection_escalation
falsepositives:
  - None expected in production. Investigate every alert.
level: high
