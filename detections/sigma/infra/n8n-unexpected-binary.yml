title: Unexpected Binary Execution in Workflow Engine Container
id: 4d6c2c3b-1284-4d0c-bb95-7c2e72b18e21
status: stable
description: |
  Detects execution of network or build tooling inside the workflow engine
  container (n8n) when the parent process is not the node runtime. The node
  runtime spawns binaries during executeCommand workflow steps; spawning
  network tools or compilers from any other parent indicates compromise or
  drift.
references:
  - https://attack.mitre.org/techniques/T1059/004/
  - https://attack.mitre.org/techniques/T1105/
  - https://github.com/ET-sec/cyber-squire1/blob/main/docs/grc/AI_AUDIT_TRAIL_SPEC.md
author: Organization Security Engineering
date: 2026-04-24
tags:
  - attack.execution
  - attack.t1059.004
  - attack.t1105
  - falco.parity
logsource:
  category: process_creation
  product: linux
detection:
  selection_container:
    Image|contains: 'svc-n8n'
  selection_binary:
    Process:
      - wget
      - curl
      - nc
      - ncat
      - nmap
      - python
      - python3
      - perl
      - ruby
      - gcc
      - cc
      - ld
  filter_node_parent:
    ParentProcess:
      - node
  condition: selection_container and selection_binary and not filter_node_parent
falsepositives:
  - Authorized n8n executeCommand workflows that legitimately invoke the listed binaries. Tag the workflow id and tune the rule per workflow.
level: medium
