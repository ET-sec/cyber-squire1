name: terraform-main

# On every merge to main that touches the OCI Terraform: mint a cloud session
# with the GitHub OIDC token exchange (no stored cloud key, see
# .github/actions/oci-session), run the real plan against remote state, and
# run the OPA policies against that plan with conftest. Pull requests cannot
# do this because the OIDC trust is pinned to main by design (terraform-pr.yml
# tests the same policies against fixture plans); this job is where the
# policies meet a real plan before anything is applied.
#
# The apply job sits behind the `production` environment (required reviewer)
# and behind the repository variable CI_APPLY_ENABLED. It stays off until the
# CI identity, read-only today, is granted a write policy in the tenancy; the
# variable is the operator's go switch. When it runs it re-plans under the
# state lock, re-runs conftest, refuses if the change set differs from the
# one the plan job reported, and applies that exact plan file.
#
# Privacy, same rule as drift-check.yml: plan output never reaches this public
# log or an artifact. The log carries resource addresses and actions only;
# policy messages and errors go to Telegram as private documents.

on:
  push:
    branches: [main]
    paths:
      - 'terraform/cd-oci-infrastructure/**'
      - '.github/workflows/terraform-main.yml'
      - '.github/actions/oci-session/**'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-main
  cancel-in-progress: false

env:
  TF_DIR: terraform/cd-oci-infrastructure
  CONFTEST_VERSION: "0.57.0"

jobs:
  plan:
    name: Real plan and OPA on main
    runs-on: ubuntu-latest
    outputs:
      exitcode: ${{ steps.plan.outputs.exitcode }}
      changes: ${{ steps.plan.outputs.changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: OCI session from the OIDC token
        uses: ./.github/actions/oci-session
        with:
          client_id: ${{ secrets.OCI_XCHG_CLIENT_ID }}
          client_secret: ${{ secrets.OCI_XCHG_CLIENT_SECRET }}
          idcs_url: ${{ secrets.OCI_IDCS_URL }}
          tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Terraform Init (remote state, session auth)
        run: |
          terraform -chdir=$TF_DIR init -input=false \
            -backend-config="bucket=${{ secrets.OCI_STATE_BUCKET }}" \
            -backend-config="namespace=${{ secrets.OCI_STATE_NAMESPACE }}" \
            -backend-config="region=us-ashburn-1" \
            -backend-config="key=${{ secrets.OCI_STATE_KEY }}" \
            -backend-config="auth=SecurityToken" \
            -backend-config="config_file_profile=DEFAULT" > init.log 2>&1 \
            || { echo "::error::terraform init failed"; tail -5 init.log; exit 1; }
          echo "init OK"

      - name: Terraform Plan (real plan, no lock)
        id: plan
        env:
          TF_VAR_oci_auth: SecurityToken
          TF_VAR_oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_ssh_allowed_cidrs: ${{ secrets.TF_VAR_SSH_ALLOWED_CIDRS }}
          TF_VAR_tfstate_bucket_name: ${{ secrets.OCI_STATE_BUCKET }}
          TF_IN_AUTOMATION: "true"
        run: |
          set +e
          terraform -chdir=$TF_DIR plan -detailed-exitcode -input=false \
            -lock=false -no-color -out=main.tfplan > plan.log 2>&1
          CODE=$?
          set -e
          echo "exitcode=$CODE" >> "$GITHUB_OUTPUT"
          echo "plan exit code: $CODE (0=no changes, 2=changes, 1=error)"
          if [ "$CODE" = "1" ]; then
            grep -m3 "Error:" plan.log || true
            echo "::error::terraform plan errored"
            exit 1
          fi
          terraform -chdir=$TF_DIR show -json "$PWD/main.tfplan" > plan.json
          SUMMARY=$(jq -r '[.resource_changes[]? | select(.change.actions != ["no-op"]) | "\(.change.actions | join("+")) \(.address)"] | join("\n")' plan.json)
          echo "planned changes (addresses only):"
          echo "${SUMMARY:-none}"
          { echo "changes<<CHANGES_EOF"; echo "$SUMMARY"; echo "CHANGES_EOF"; } >> "$GITHUB_OUTPUT"
          { echo "## terraform-main: plan"; echo ""; echo "Exit code $CODE. Planned changes:"; echo '```'; echo "${SUMMARY:-none}"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Conftest
        run: |
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" conftest
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: OPA policies against the real plan
        id: conftest
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          conftest test plan.json --policy $TF_DIR/policy/ --no-color > conftest.txt 2>&1
          CODE=$?
          set -e
          # Only the tally is public; the messages name resources and values.
          TALLY=$(grep -E '^[0-9]+ tests?,' conftest.txt | tail -1)
          echo "conftest: ${TALLY:-no tally line} (exit $CODE)"
          { echo ""; echo "OPA against the real plan: ${TALLY:-no tally line} (exit $CODE)"; } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ]; then
            TEXT=$(printf 'OPA DENY on main (terraform-main, run %s)\n%s\nThe merged Terraform violates a policy. Nothing was applied. Report attached.' "${{ github.run_id }}" "$TALLY")
            curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$TEXT"
            curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendDocument" \
              -F "chat_id=$TG_CHAT" -F "document=@conftest.txt;filename=opa-main-${{ github.run_id }}.txt" \
              -F "caption=terraform-main conftest report"
            echo "::error::OPA policy failure on the real plan; report sent to Telegram."
            exit 1
          fi
          echo "policies pass on the real plan"

      - name: Scrub plan files
        if: always()
        run: rm -f main.tfplan plan.json plan.log conftest.txt upst.token session.pem

  apply:
    name: Apply after review
    needs: plan
    if: needs.plan.outputs.exitcode == '2' && vars.CI_APPLY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: terraform-oci-state
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: OCI session from the OIDC token
        uses: ./.github/actions/oci-session
        with:
          client_id: ${{ secrets.OCI_XCHG_CLIENT_ID }}
          client_secret: ${{ secrets.OCI_XCHG_CLIENT_SECRET }}
          idcs_url: ${{ secrets.OCI_IDCS_URL }}
          tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Terraform Init (remote state, session auth)
        run: |
          terraform -chdir=$TF_DIR init -input=false \
            -backend-config="bucket=${{ secrets.OCI_STATE_BUCKET }}" \
            -backend-config="namespace=${{ secrets.OCI_STATE_NAMESPACE }}" \
            -backend-config="region=us-ashburn-1" \
            -backend-config="key=${{ secrets.OCI_STATE_KEY }}" \
            -backend-config="auth=SecurityToken" \
            -backend-config="config_file_profile=DEFAULT" > init.log 2>&1 \
            || { echo "::error::terraform init failed"; tail -5 init.log; exit 1; }
          echo "init OK"

      - name: Install Conftest
        run: |
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz" conftest
          sudo mv conftest /usr/local/bin/

      - name: Re-plan under the state lock, re-check policy, confirm the reviewed change set
        env:
          TF_VAR_oci_auth: SecurityToken
          TF_VAR_oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_ssh_allowed_cidrs: ${{ secrets.TF_VAR_SSH_ALLOWED_CIDRS }}
          TF_VAR_tfstate_bucket_name: ${{ secrets.OCI_STATE_BUCKET }}
          TF_IN_AUTOMATION: "true"
          REVIEWED: ${{ needs.plan.outputs.changes }}
        run: |
          terraform -chdir=$TF_DIR plan -detailed-exitcode -input=false -no-color -out=apply.tfplan > plan.log 2>&1 || CODE=$?
          CODE=${CODE:-0}
          if [ "$CODE" = "1" ]; then grep -m3 "Error:" plan.log || true; echo "::error::re-plan errored"; exit 1; fi
          if [ "$CODE" = "0" ]; then echo "nothing left to apply (state moved since the plan job)"; echo "NOOP=1" >> "$GITHUB_ENV"; exit 0; fi
          terraform -chdir=$TF_DIR show -json "$PWD/apply.tfplan" > plan.json
          NOW=$(jq -r '[.resource_changes[]? | select(.change.actions != ["no-op"]) | "\(.change.actions | join("+")) \(.address)"] | join("\n")' plan.json)
          if [ "$NOW" != "$REVIEWED" ]; then
            echo "::error::change set differs from the one the plan job reported; refusing to apply"
            echo "reviewed:"; echo "$REVIEWED"; echo "now:"; echo "$NOW"
            exit 1
          fi
          conftest test plan.json --policy $TF_DIR/policy/ --no-color > conftest.txt 2>&1 || { echo "::error::OPA policy failure at apply time"; grep -E '^[0-9]+ tests?,' conftest.txt; exit 1; }
          echo "change set confirmed and policies pass:"; echo "$NOW"

      - name: Terraform Apply (the reviewed plan file)
        if: env.NOOP != '1'
        env:
          TF_VAR_oci_auth: SecurityToken
          TF_VAR_oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_ssh_allowed_cidrs: ${{ secrets.TF_VAR_SSH_ALLOWED_CIDRS }}
          TF_VAR_tfstate_bucket_name: ${{ secrets.OCI_STATE_BUCKET }}
          TF_IN_AUTOMATION: "true"
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          REVIEWED: ${{ needs.plan.outputs.changes }}
        run: |
          set +e
          terraform -chdir=$TF_DIR apply -input=false -no-color "$PWD/apply.tfplan" > apply.log 2>&1
          CODE=$?
          set -e
          if [ "$CODE" -ne 0 ]; then
            grep -m3 "Error:" apply.log || true
            curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
              --data-urlencode "chat_id=$TG_CHAT" \
              --data-urlencode "text=APPLY FAILED (terraform-main, run ${{ github.run_id }}). State may be partially changed. Log attached."
            curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendDocument" \
              -F "chat_id=$TG_CHAT" -F "document=@apply.log;filename=apply-${{ github.run_id }}.txt"
            echo "::error::terraform apply failed; log sent to Telegram."
            exit 1
          fi
          TEXT=$(printf 'APPLIED (terraform-main, run %s, approved in the production environment)\n%s' "${{ github.run_id }}" "$REVIEWED")
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$TEXT"
          echo "applied:"; echo "$REVIEWED"

      - name: Scrub plan files
        if: always()
        run: rm -f apply.tfplan plan.json plan.log apply.log conftest.txt upst.token session.pem
