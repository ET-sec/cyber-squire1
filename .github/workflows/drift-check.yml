name: drift-check

# Phase 20.1-04: nightly infrastructure drift detection.
# Authenticates to OCI with the GitHub OIDC token exchange (no stored cloud
# keys; the exchange lives in .github/actions/oci-session, shared with
# terraform-main.yml), then runs a read-only
# terraform plan against live infrastructure. Exit 0 = reality matches code.
# Exit 2 = drift: a Telegram alert fires with the resource list, and the full
# plan goes to Telegram as a private document. The plan output is NEVER
# printed to this public log and never uploaded as an artifact: it can
# contain resource identifiers and network detail that stay private.
# The CI principal (cd-ci) holds a read-only policy; this job cannot mutate
# anything, and the plan runs with -lock=false so it also cannot wedge the
# state lock.

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: drift-check
  cancel-in-progress: false

env:
  TF_DIR: terraform/cd-oci-infrastructure

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: OCI session from the OIDC token
        uses: ./.github/actions/oci-session
        with:
          client_id: ${{ secrets.OCI_XCHG_CLIENT_ID }}
          client_secret: ${{ secrets.OCI_XCHG_CLIENT_SECRET }}
          idcs_url: ${{ secrets.OCI_IDCS_URL }}
          tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_wrapper: false

      - name: Terraform Init (remote state, session auth)
        run: |
          terraform -chdir=$TF_DIR init -input=false \
            -backend-config="bucket=${{ secrets.OCI_STATE_BUCKET }}" \
            -backend-config="namespace=${{ secrets.OCI_STATE_NAMESPACE }}" \
            -backend-config="region=us-ashburn-1" \
            -backend-config="key=${{ secrets.OCI_STATE_KEY }}" \
            -backend-config="auth=SecurityToken" \
            -backend-config="config_file_profile=DEFAULT" > init.log 2>&1 \
            || { echo "::error::terraform init failed"; tail -5 init.log; exit 1; }
          echo "init OK"

      - name: Terraform Plan (read-only drift check)
        id: plan
        env:
          TF_VAR_oci_auth: SecurityToken
          TF_VAR_oci_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_ssh_allowed_cidrs: ${{ secrets.TF_VAR_SSH_ALLOWED_CIDRS }}
          TF_VAR_tfstate_bucket_name: ${{ secrets.OCI_STATE_BUCKET }}
          TF_IN_AUTOMATION: "true"
        run: |
          set +e
          terraform -chdir=$TF_DIR plan -detailed-exitcode -input=false \
            -lock=false -no-color -out=drift.tfplan > plan.log 2>&1
          CODE=$?
          set -e
          echo "exitcode=$CODE" >> "$GITHUB_OUTPUT"
          echo "plan exit code: $CODE (0=clean, 2=drift, 1=error)"
          # Error headlines only (class + resource address); full detail
          # goes to Telegram, never to this public log.
          [ "$CODE" = "1" ] && grep -m3 "Error:" plan.log || true

      - name: Report clean
        if: steps.plan.outputs.exitcode == '0'
        run: echo "NO DRIFT — live infrastructure matches code."

      - name: Alert on drift (Telegram, details stay private)
        if: steps.plan.outputs.exitcode == '2'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          SUMMARY=$(terraform -chdir=$TF_DIR show -json drift.tfplan \
            | jq -r '[.resource_changes[] | select(.change.actions != ["no-op"]) | "\(.change.actions | join("+")) \(.address)"] | join("\n")')
          echo "drifted resources (addresses only):"
          echo "$SUMMARY"
          TEXT=$(printf 'DRIFT DETECTED (drift-check, run %s)\nLive infrastructure no longer matches Terraform:\n%s\nFull plan attached. Codify or revert, never ignore.' \
            "${{ github.run_id }}" "$SUMMARY")
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$TEXT"
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendDocument" \
            -F "chat_id=$TG_CHAT" -F "document=@plan.log;filename=drift-plan-${{ github.run_id }}.txt" \
            -F "caption=drift-check full plan output"
          echo "Telegram alert sent."
          echo "::error::Drift detected: live infrastructure was changed outside Terraform."
          exit 1

      - name: Alert on plan error
        if: steps.plan.outputs.exitcode != '0' && steps.plan.outputs.exitcode != '2'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" \
            --data-urlencode "text=drift-check FAILED to run (run ${{ github.run_id }}): terraform plan errored. Log attached."
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendDocument" \
            -F "chat_id=$TG_CHAT" -F "document=@plan.log;filename=drift-error-${{ github.run_id }}.txt"
          echo "::error::terraform plan errored; log sent to Telegram."
          exit 1

  review-register:
    # Event triggered review items (Phase 21, SWEEP-03). Deliberately a separate
    # job: it needs no cloud identity, and a Terraform plan failure in the drift
    # job must not be able to suppress it. It takes none of the id-token
    # permission granted above and does not use needs:, so it runs on the same
    # nightly schedule whatever the drift job does. The owner fires an item by
    # setting the named repository variable; nothing here fires itself.
    #
    # Force one without changing anything else:
    #   gh variable set TRIGGER_GRC_LIBRARIAN --body true -R ET-sec/cyber-squire1
    #   gh workflow run drift-check.yml -R ET-sec/cyber-squire1
    #   gh variable delete TRIGGER_GRC_LIBRARIAN -R ET-sec/cyber-squire1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: pip install pyyaml
      - name: Evaluate the register
        id: fired
        env:
          TRIGGER_AWS_CREDITS: ${{ vars.TRIGGER_AWS_CREDITS }}
          TRIGGER_SECOND_TENANT: ${{ vars.TRIGGER_SECOND_TENANT }}
          TRIGGER_IDENTITY_TIER: ${{ vars.TRIGGER_IDENTITY_TIER }}
          TRIGGER_PROVIDER_TERMS: ${{ vars.TRIGGER_PROVIDER_TERMS }}
          TRIGGER_GRC_LIBRARIAN: ${{ vars.TRIGGER_GRC_LIBRARIAN }}
        run: |
          # The script prints nothing when no item fires, so zero bytes means
          # nothing to send. It also writes fired_count to $GITHUB_OUTPUT; the
          # two agree by construction, and the byte count is what gates the post.
          python3 scripts/repo/review_register.py --format text > fired.txt
          echo "count=$(wc -c < fired.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"
      - name: Post fired items to Telegram
        if: steps.fired.outputs.count != '0'
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT=$(printf 'REVIEW TRIGGER FIRED (run %s)\n%s' "${{ github.run_id }}" "$(cat fired.txt)")
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot$TG_TOKEN/sendMessage" \
            --data-urlencode "chat_id=$TG_CHAT" --data-urlencode "text=$TEXT"
          echo "Telegram alert sent for the fired review items."
