name: image-smoke
on:
  pull_request:
    paths:
      - 'COREDIRECTIVE_ENGINE/docker-compose.yaml'
      - 'COREDIRECTIVE_ENGINE/docker-compose.yml'
      - '.github/workflows/image-smoke.yml'

permissions:
  contents: read

jobs:
  detect-changed-images:
    name: Detect changed images
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - name: Diff image lines
        id: diff
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          COMPOSE="COREDIRECTIVE_ENGINE/docker-compose.yaml"
          if ! git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -q "^$COMPOSE$"; then
            echo "images=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ADDED=$(git diff "$BASE_SHA" "$HEAD_SHA" -- "$COMPOSE" | { grep -E '^\+\s+image:' || true; } | sed -E 's/^\+\s+image:\s+//' | sort -u)
          if [ -z "$ADDED" ]; then
            echo "images=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          JSON=$(echo "$ADDED" | jq -R . | jq -sc .)
          echo "images=$JSON" >> "$GITHUB_OUTPUT"
          echo "Changed image references:"
          echo "$ADDED"

  smoke-test:
    name: Smoke test image
    needs: detect-changed-images
    if: needs.detect-changed-images.outputs.images != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect-changed-images.outputs.images) }}
    steps:
      - name: Skip locally built images
        id: skip
        run: |
          if [[ "${{ matrix.image }}" =~ ^cd-service- ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Locally built image — covered by separate build pipeline. Skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Pull image
        if: steps.skip.outputs.skip == 'false'
        run: |
          docker pull "${{ matrix.image }}"
      - name: Inspect image
        if: steps.skip.outputs.skip == 'false'
        run: |
          docker inspect "${{ matrix.image }}" --format 'Id: {{.Id}}{{println}}Size: {{.Size}}{{println}}Created: {{.Created}}{{println}}Cmd: {{.Config.Cmd}}'
      - name: Start container
        if: steps.skip.outputs.skip == 'false'
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          # Start with the image's default command. Many services need
          # environment to fully start; that is the job of a full integration
          # test, not this smoke test. Here we only verify the image boots far
          # enough to run its own binary.
          CID=$(docker run -d "$IMAGE" 2>/dev/null || true)
          if [ -n "$CID" ]; then
            sleep 5
            if docker ps --filter id="$CID" --format '{{.Status}}' | grep -q Up; then
              echo "Container running."
              docker logs "$CID" 2>&1 | tail -20 || true
              docker rm -f "$CID" >/dev/null 2>&1 || true
              exit 0
            fi
            EXIT_CODE=$(docker inspect "$CID" --format '{{.State.ExitCode}}' 2>/dev/null || echo 1)
            echo "Container exited with $EXIT_CODE. Logs:"
            docker logs "$CID" 2>&1 | tail -20 || true
            docker rm -f "$CID" >/dev/null 2>&1 || true
            # A clean exit is fine for run-to-completion images.
            [ "$EXIT_CODE" = "0" ] && exit 0
          fi
          # Services such as Keycloak, Vector and Teleport stop at once without
          # their config. Prove the binary itself runs by asking for its version.
          case "$IMAGE" in
            *teleport-distroless*) PROBES=("--entrypoint /usr/local/bin/teleport|version") ;;
            *) PROBES=("|--version" "|version") ;;
          esac
          for p in "${PROBES[@]}"; do
            OPTS="${p%%|*}"; ARGS="${p#*|}"
            # shellcheck disable=SC2086
            if OUT=$(timeout 60 docker run --rm $OPTS "$IMAGE" $ARGS 2>&1); then
              echo "Version probe passed ($OPTS $ARGS):"
              echo "$OUT" | tail -5
              exit 0
            fi
          done
          echo "Image neither stays up, exits cleanly, nor answers a version probe."
          exit 1
