---
# Agent Card signing workflow.
#
# On any push to main that touches .agents/*.card.json, this workflow signs
# every card with cosign sign-blob using keyless OIDC and delivers the resulting
# .sigstore.json bundles through an auto-merging pull request.
#
# Why a pull request and not a direct push: main is a protected branch with
# required status checks, which refuses a direct push from Actions. Signing still
# runs on main (push trigger), so the Fulcio certificate identity stays
# .../agent-signing.yml@refs/heads/main, which is what verify_agent_signatures.sh
# pins. Only delivery changed, so verification is unaffected.
#
# Trust model: keyless OIDC via Sigstore. There is no long-lived key. Every
# signature ties to this workflow run on this branch via a Fulcio-issued
# short-lived certificate. See docs/grc/AGENT_SIGNING.md.
#
# Kill switch: set repo Variable AGENT_SIGNING_DISABLED=true to skip the job
# without touching code.

name: agent-signing

on:
  push:
    branches: [main]
    paths:
      - '.agents/**.card.json'
  workflow_dispatch: {}

permissions:
  id-token: write        # required for keyless OIDC
  contents: write        # push the bundle branch
  pull-requests: write   # open the auto-merging bundle pull request

concurrency:
  group: agent-signing-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sign-cards:
    if: vars.AGENT_SIGNING_DISABLED != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install Cosign
        # pinned to v3.7.0 (sigstore/cosign-installer)
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da
        with:
          cosign-release: 'v2.6.0'

      - name: Validate cards before signing
        run: |
          python3 scripts/grc/validate_agent_cards.py

      - name: Sign each Agent Card with cosign sign-blob
        run: |
          set -euo pipefail
          shopt -s nullglob
          signed_count=0
          for f in .agents/*.card.json; do
            echo "Signing ${f}"
            cosign sign-blob \
              --bundle "${f}.sigstore.json" \
              --new-bundle-format \
              --yes \
              "${f}"
            signed_count=$((signed_count + 1))
          done
          echo "Signed ${signed_count} card(s)."
          echo "SIGNED_COUNT=${signed_count}" >> "${GITHUB_ENV}"

      - name: Deliver bundles through an auto-merging pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name 'Emmanuel Tigoue'
          git config user.email '157398893+ET-sec@users.noreply.github.com'
          git add .agents/*.sigstore.json
          if git diff --cached --quiet; then
            echo "No new or changed bundles to commit."
            exit 0
          fi
          BRANCH="agent-signing-bundles"
          git checkout -B "$BRANCH"
          git commit -m 'chore(agent-signing): signed agent card bundles'
          git push -f origin "$BRANCH"
          # Open the PR if none is open for this branch, then let it merge itself
          # once the required checks pass. delete_branch_on_merge cleans it up.
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title 'chore(agent-signing): signed agent card bundles' \
              --body 'Sigstore bundles regenerated by the agent-signing workflow on main. Auto-merges once the required checks pass; no direct push to the protected branch.'
          else
            echo "PR already open for ${BRANCH}; branch force-updated."
          fi
          gh pr merge "$BRANCH" --auto --squash || echo "auto-merge already set."

      - name: Job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## Agent Card signing summary"
            echo ""
            echo "| Card | Bundle |"
            echo "| ---- | ------ |"
            for f in .agents/*.card.json; do
              bundle="${f}.sigstore.json"
              echo "| ${f} | ${bundle} |"
            done
          } >> "${GITHUB_STEP_SUMMARY}"
