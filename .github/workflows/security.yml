name: Security Pipeline

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main"]

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # --- Secrets Detection ---
      - name: Gitleaks secret detection
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      # --- Filesystem / Dependency Scan ---
      - name: Trivy CVE and misconfig scan
        uses: aquasecurity/trivy-action@cf5c088a69634cd13ccddc735d7926162c31f9a6 # master
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-results.sarif"
          exit-code: "1"
          ignore-unfixed: true
          skip-dirs: "DEPRECATED"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

      # --- Static Analysis (SAST) ---
      - name: Semgrep SAST audit
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/docker
            p/terraform
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      # Snyk Open Source dependency scan, free tier.
      # Runs alongside Trivy. Trivy covers OS packages and image layers.
      # Snyk covers application dependency manifests (pip, poetry, npm, go.mod)
      # with reachability scoring. continue-on-error keeps the pipeline green
      # while the baseline is tuned. Flip to false once the baseline is clean.
      - name: Detect Snyk token
        id: snyk_token
        run: |
          if [ -n "${{ secrets.SNYK_TOKEN }}" ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
          fi

      - name: Snyk Open Source dependency scan
        if: steps.snyk_token.outputs.present == 'true'
        continue-on-error: true
        uses: snyk/actions/python@8e119fbb6c251787721d34ba683ed48eba792766 # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test
          args: --severity-threshold=high --sarif-file-output=snyk-results.sarif --all-projects --exclude=DEPRECATED

      - name: Upload Snyk SARIF results
        if: steps.snyk_token.outputs.present == 'true' && always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: snyk-results.sarif
          category: snyk

      - name: Snyk Container scan (Squire image)
        if: steps.snyk_token.outputs.present == 'true' && hashFiles('builds/squire/Dockerfile') != ''
        continue-on-error: true
        uses: snyk/actions/docker@8e119fbb6c251787721d34ba683ed48eba792766 # master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: ghcr.io/${{ github.repository_owner }}/svc-squire:${{ github.sha }}
          args: --file=builds/squire/Dockerfile --severity-threshold=high --sarif-file-output=snyk-container.sarif

      - name: Upload Snyk container SARIF
        if: steps.snyk_token.outputs.present == 'true' && always()
        uses: github/codeql-action/upload-sarif@dd903d2e4f5405488e5ef1422510ee31c8b32357 # v3
        with:
          sarif_file: snyk-container.sarif
          category: snyk-container

  # The DigitalOcean apply job that lived here was retired 2026-08-31
  # (Phase 20.1-05): its target infrastructure died in August 2026 and its
  # credentials are being removed. OCI changes deploy from a workstation
  # against remote locked state; CI's cloud role is read-only drift
  # detection (drift-check.yml) by design.

  poam-sync:
    name: POA&M Ledger Sync
    runs-on: ubuntu-latest
    needs: security-scan
    if: always() && github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run scanners for machine-readable output
        run: |
          pipx install checkov >/dev/null 2>&1 || pip install -q checkov
          checkov -d terraform/cd-oci-infrastructure -o json --quiet > checkov.json || true
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar xz gitleaks
          mkdir -p /tmp/tracked && git archive HEAD | tar -x -C /tmp/tracked
          ./gitleaks detect --no-git --source /tmp/tracked \
            --config .gitleaks.toml --report-format json \
            --report-path gitleaks.json --exit-code 0

      - name: Sync ledger
        run: |
          python3 scripts/poam_sync.py --checkov checkov.json --gitleaks gitleaks.json
          git diff --stat docs/grc/POAM_AUTO_FINDINGS.md || true

      - name: Open PR if the ledger changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet docs/grc/POAM_AUTO_FINDINGS.md; then
            echo "ledger unchanged, nothing to do"
            exit 0
          fi
          git config user.name "poam-sync-bot"
          git config user.email "actions@github.com"
          BRANCH="bot/poam-sync"
          git checkout -B "$BRANCH"
          git add docs/grc/POAM_AUTO_FINDINGS.md
          git commit -m "chore(grc): poam_sync ledger update from scanner run ${{ github.run_id }}"
          git push -f origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "chore(grc): POA&M auto-findings ledger update" \
            --body "Script-generated by poam_sync from run ${{ github.run_id }}. Rows are scanner-owned; review and merge." \
            2>/dev/null || echo "PR already open, branch updated"

  container-verification:
    name: Container Image Verification
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && github.event_name == 'push')
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@faadad0cce49287aee09b3a48701e75088a2c6ad # v4.0.0

      # Fails closed. Every image the compose files pin is checked against the
      # publisher's policy in .github/image-signers.json: keyless with a pinned
      # identity and issuer, or a public key kept in the repo. A signed image
      # that does not verify, or an image with no policy, fails the job on the
      # pull request and on main. Publishers that do not sign are reported as
      # unsigned, never counted as passed. Runs on pull requests so a Renovate
      # bump cannot auto-merge past it.
      - name: Verify pinned image signatures against the signer policy
        run: python3 scripts/verify_image_signatures.py

  sbom:
    name: Generate SBOMs
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # --- Repository filesystem SBOM ---
      - name: SBOM for repository filesystem
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: "."
          format: "spdx-json"
          output-file: "sbom-repo.spdx.json"
          artifact-name: "sbom-repo-${{ github.sha }}-${{ github.run_id }}"


      # --- Per-image SBOMs ---
      - name: "SBOM pgvector/pgvector:pg16 (live pin)"
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
          format: spdx-json
          output-file: sbom-postgres.spdx.json
          artifact-name: sbom-postgres-${{ github.sha }}-${{ github.run_id }}


      - name: "SBOM n8nio/n8n (live pin)"
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: n8nio/n8n:2.17.5@sha256:81dc967a062bf267d6aa827e5dfb492ce80e366e77f3b8051c07970a653fb69a
          format: spdx-json
          output-file: sbom-n8n.spdx.json
          artifact-name: sbom-n8n-${{ github.sha }}-${{ github.run_id }}


      - name: "SBOM hashicorp/vault (pinned)"
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: hashicorp/vault:1.15@sha256:0450896c43b13879b19442b204ce29dd19b5a10fce43d5cf38af17da20f56f4d
          format: spdx-json
          output-file: sbom-vault.spdx.json
          artifact-name: sbom-vault-${{ github.sha }}-${{ github.run_id }}


      - name: "SBOM datadog/agent (pinned)"
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: datadog/agent:7.78.0@sha256:506c580f21aa53830b47a7ea161760d9a088ed689d17a85521b4138695a9ee59
          format: spdx-json
          output-file: sbom-datadog.spdx.json
          artifact-name: sbom-datadog-${{ github.sha }}-${{ github.run_id }}


      - name: "SBOM cloudflare/cloudflared (live pin)"
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: cloudflare/cloudflared:2026.3.0@sha256:6b599ca3e974349ead3286d178da61d291961182ec3fe9c505e1dd02c8ac31b0
          format: spdx-json
          output-file: sbom-cloudflared.spdx.json
          artifact-name: sbom-cloudflared-${{ github.sha }}-${{ github.run_id }}

