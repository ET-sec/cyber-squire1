name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    paths-ignore:
      - 'docs/grc/**'
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-agent-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: true

jobs:
  pr_agent:
    if: ${{ vars.PR_AGENT_DISABLED != 'true' && github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Budget guard
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DAILY_LIMIT_USD: "1.00"
        run: |
          # Lightweight check via curl since pr-agent action checks out separately
          curl -fsS https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/grc/budget_guard.py -o /tmp/bg.py 2>/dev/null \
            && python3 /tmp/bg.py \
            || echo "WARN: budget_guard not available on this ref; PR-Agent has its own max_model_tokens cap"
      - name: PR Agent action
        uses: qodo-ai/pr-agent@0e37fc84fcc8207561e64eef8f7f634fb57e8447
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          config.model: "anthropic/claude-sonnet-4-6"
          config.fallback_models: '["anthropic/claude-fable-5"]'
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "true"
