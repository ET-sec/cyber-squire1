name: portfolio-sync
# Fails when a generator, a rendered view, or metrics.yaml changed without the portfolio being synced.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ET-sec/portfolio
          ref: main
          path: portfolio
      - name: Generators reproduce the committed views
        run: |
          python3 docs/grc/diagrams/views/render_views.py
          git diff --exit-code -- docs/grc/diagrams/views/
      - name: Portfolio numbers match metrics.yaml
        run: python3 scripts/sync_portfolio.py --portfolio-root portfolio
      - name: Portfolio views match rendered views
        run: python3 scripts/sync_views.py --check --portfolio portfolio
