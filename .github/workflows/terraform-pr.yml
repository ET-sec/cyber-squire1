name: Terraform PR Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/cd-do-infrastructure/**'
      - '.github/workflows/terraform-pr.yml'

permissions:
  contents: read
  pull-requests: write

env:
  TF_DIR: terraform/cd-do-infrastructure
  TF_IN_AUTOMATION: true

jobs:
  terraform-checks:
    name: Terraform Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: true

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6

      - name: Terraform Format Check
        id: fmt
        continue-on-error: true
        run: terraform -chdir=$TF_DIR fmt -check -diff

      - name: Terraform Init
        id: init
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          terraform -chdir=$TF_DIR init \
            -backend-config="access_key=${{ secrets.SPACES_ACCESS_KEY }}" \
            -backend-config="secret_key=${{ secrets.SPACES_SECRET_KEY }}"

      - name: Terraform Validate
        id: validate
        run: terraform -chdir=$TF_DIR validate -no-color

      - name: TFLint Init
        run: cd $TF_DIR && tflint --init --config=.tflint.hcl

      - name: TFLint
        id: tflint
        run: cd $TF_DIR && tflint --config=.tflint.hcl --no-color

      - name: Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/cd-do-infrastructure
          config_file: terraform/cd-do-infrastructure/.checkov.yaml
          output_format: cli
          soft_fail: false

      - name: Terraform Plan
        id: plan
        continue-on-error: true
        env:
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        run: |
          terraform -chdir=$TF_DIR plan -no-color -input=false \
            -detailed-exitcode \
            -var="cf_zone_id=${{ vars.CF_ZONE_ID }}" \
            -var="cf_account_id=${{ vars.CF_ACCOUNT_ID }}" \
            -var="cf_tunnel_id=${{ vars.CF_TUNNEL_ID }}"

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PLAN_STDOUT: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- terraform-plan-comment -->';

            // Collect step outcomes
            const fmt = '${{ steps.fmt.outcome }}';
            const init = '${{ steps.init.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const tflint = '${{ steps.tflint.outcome }}';
            const checkov = '${{ steps.checkov.outcome }}';
            const plan = '${{ steps.plan.outcome }}';

            const icon = (s) => s === 'success' ? '\\`pass\\`' : '\\`FAIL\\`';

            // Get plan output safely via env var (avoids JS injection from backticks/${ in output)
            let planOutput = process.env.PLAN_STDOUT || '';
            if (planOutput.trim() === '') {
              planOutput = 'No plan output captured.';
            }

            // Truncate if too large (GitHub comment limit is 65536 chars)
            const maxLen = 60000;
            if (planOutput.length > maxLen) {
              planOutput = planOutput.substring(0, maxLen) + '\n\n... (truncated, output exceeded 60000 chars)';
            }

            const body = [
              marker,
              '## Terraform PR Validation',
              '',
              '| Check | Status |',
              '|-------|--------|',
              '| Format | ' + icon(fmt) + ' |',
              '| Init | ' + icon(init) + ' |',
              '| Validate | ' + icon(validate) + ' |',
              '| TFLint | ' + icon(tflint) + ' |',
              '| Checkov | ' + icon(checkov) + ' |',
              '| Plan | ' + icon(plan) + ' |',
              '',
              '<details><summary>Show Plan Output</summary>',
              '',
              '```',
              planOutput,
              '```',
              '',
              '</details>',
              '',
              '*Triggered by @' + context.actor + ' on `' + context.eventName + '`*',
              '*Commit: ' + context.sha.substring(0, 7) + '*',
            ].join('\n');

            // Find existing comment with marker
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body,
              });
            }

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
