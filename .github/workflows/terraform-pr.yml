name: Terraform PR Validation

# Phase 20.1-05: gate rewritten from the retired DigitalOcean pipeline to the
# active OCI directory. Every check here is credential-free by design: the
# OIDC trust that mints cloud tokens is pinned to main, so PR branches cannot
# authenticate (that is the control, not a limitation). The live plan and the
# OPA check against a real plan run post-merge in drift-check.yml. What a PR
# CAN prove without credentials: formatting, validity, Checkov policy
# compliance, and that the committed OPA policies still catch the violation
# fixtures and pass the clean fixture.

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/cd-oci-infrastructure/**'
      - 'terraform/cd-aws-security-plane/**'
      - '.github/workflows/terraform-pr.yml'

permissions:
  contents: read
  pull-requests: write

env:
  TF_IN_AUTOMATION: true

jobs:
  terraform-checks:
    name: Terraform Checks (${{ matrix.dir }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir:
          - terraform/cd-oci-infrastructure
          - terraform/cd-aws-security-plane
    env:
      TF_DIR: ${{ matrix.dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.12.2"
          terraform_wrapper: false

      - name: Terraform Format Check
        id: fmt
        run: terraform -chdir=$TF_DIR fmt -check -diff

      - name: Terraform Init (no backend, no credentials)
        id: init
        run: terraform -chdir=$TF_DIR init -backend=false -input=false

      - name: Terraform Validate
        id: validate
        run: terraform -chdir=$TF_DIR validate -no-color

      - name: Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@fa9edf8f0a491c59a924ea6accd5bdcf07752cff # master
        with:
          directory: ${{ matrix.dir }}
          output_format: cli
          soft_fail: false

      - name: Install Conftest
        run: |
          CONFTEST_VERSION="0.57.0"
          wget -q "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf "conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          sudo mv conftest /usr/local/bin/
          conftest --version

      - name: OPA Policy Self-Test (fixtures)
        id: conftest
        run: |
          if [ ! -d "$TF_DIR/policy/testdata" ]; then
            echo "no OPA fixture pack in $TF_DIR, skipping self-test"
            exit 0
          fi
          echo "## OPA Policy Self-Test" >> $GITHUB_STEP_SUMMARY
          # No pipes here: the default runner shell has no pipefail, so a
          # piped conftest exit code would be swallowed by tee.
          set +e
          conftest test $TF_DIR/policy/testdata/plan_clean.json \
            --policy $TF_DIR/policy/ --no-color > clean.txt 2>&1
          CLEAN_EXIT=$?
          conftest test $TF_DIR/policy/testdata/plan_violations.json \
            --policy $TF_DIR/policy/ --no-color > violations.txt 2>&1
          VIOL_EXIT=$?
          set -e
          cat clean.txt violations.txt
          {
            echo '```'
            cat clean.txt violations.txt
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          # The clean fixture must pass; the violation fixture must FAIL.
          # A policy set that accepts the violation fixture is broken.
          if [ "$CLEAN_EXIT" -ne 0 ]; then
            echo "::error::OPA policies reject the clean fixture"; exit 1
          fi
          if [ "$VIOL_EXIT" -eq 0 ]; then
            echo "::error::OPA policies no longer catch the violation fixture"; exit 1
          fi
          echo "policies pass clean fixture and catch violation fixture"

      - name: Post PR Comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- terraform-plan-comment-${{ matrix.dir }} -->';
            const fmt = '${{ steps.fmt.outcome }}';
            const init = '${{ steps.init.outcome }}';
            const validate = '${{ steps.validate.outcome }}';
            const checkov = '${{ steps.checkov.outcome }}';
            const conftest = '${{ steps.conftest.outcome }}';
            const icon = (s) => s === 'success' ? '`pass`' : '`FAIL`';
            const body = [
              marker,
              '## Terraform PR Validation (${{ matrix.dir }})',
              '',
              '| Check | Status |',
              '|-------|--------|',
              '| Format | ' + icon(fmt) + ' |',
              '| Init (backendless) | ' + icon(init) + ' |',
              '| Validate | ' + icon(validate) + ' |',
              '| Checkov | ' + icon(checkov) + ' |',
              '| OPA policy self-test | ' + icon(conftest) + ' |',
              '',
              'Live plan + OPA against the real plan run post-merge in `drift-check.yml`',
              '(the OIDC trust is pinned to main, so PR branches hold no cloud identity).',
              '',
              '*Triggered by @' + context.actor + ' on `' + context.eventName + '`*',
              '*Commit: ' + context.sha.substring(0, 7) + '*',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body: body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body: body,
              });
            }
