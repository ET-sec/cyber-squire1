title = "Gitleaks config: cyber-squire-ops (public part)"

# CRITICAL: a custom config REPLACES gitleaks' built-in ruleset unless it
# extends it. useDefault pulls in the full default ruleset; the rules below
# are additions on top, not the whole defense (proven live 2026-08-31).
#
# Two-layer layout (2026-09-08): this tracked file carries only PATTERN-shaped
# tripwires, because a literal value in a public rule file publishes the very
# thing the rule exists to keep out of the repository. Literal tripwires (dead
# host addresses, account identifiers, personal contact values) live in the
# gitignored .gitleaks.local.toml, which extends this file. The git hooks refuse
# to run without the local file; CI runs this file on its own.
[extend]
useDefault = true

[[rules]]
id = "internal-hostnames"
description = "Internal service hostnames"
regex = '''(n8n|ssh|vault)\.tigouetheory\.com'''
tags = ["infrastructure"]

[[rules]]
id = "doppler-config-path"
description = "Doppler project/config identifiers"
regex = '''coredirective-engine/(prd|stg|dev)'''
tags = ["infrastructure"]

[[rules]]
id = "droplet-paths"
description = "Host filesystem paths from the previous provider"
regex = '''/root/COREDIRECTIVE_ENGINE'''
tags = ["infrastructure"]

[[rules]]
id = "datadog-region"
description = "SIEM site region"
regex = '''us[0-9]\.datadoghq\.com'''
tags = ["infrastructure"]

[[rules]]
id = "object-storage-buckets"
description = "Bucket names of the state and audit stores"
regex = '''cd-(terraform-state|audit-logs)'''
tags = ["infrastructure"]

[[rules]]
id = "telegram-chat-id-assignment"
description = "A Telegram chat id assigned in code or config"
regex = '''chat_id["\']?\s*[:=]\s*["\']?[0-9]{9,10}\b'''
tags = ["pii"]

[[rules]]
id = "us-phone-number"
description = "A phone number in the (NNN) NNN-NNNN shape"
regex = '''\([0-9]{3}\)\s*[0-9]{3}-[0-9]{4}'''
tags = ["pii"]

[[rules]]
id = "gmail-address"
description = "Any Gmail address (personal logins never belong in this repository)"
regex = '''[A-Za-z0-9._%+-]+@gmail\.com'''
tags = ["pii"]

[[rules]]
id = "cloudflare-id-assignment"
description = "A Cloudflare zone or account id assigned in code or config"
regex = '''(zone_id|account_id|ZONE_ID|ACCOUNT_ID)["\']?\s*[:=]\s*["\']?[0-9a-f]{32}\b'''
tags = ["infrastructure"]

[[rules]]
id = "cloudflare-tunnel-id-assignment"
description = "A Cloudflare tunnel id assigned in code or config"
regex = '''(tunnel_id|TUNNEL_ID)["\']?\s*[:=]\s*["\']?[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\b'''
tags = ["infrastructure"]

[allowlist]
description = "Known rotated/revoked secrets in git history. Telegram bot token was revoked on 2026-03-08."
# The 555 exchange (NNN) 555-NNNN is reserved for fiction and testing and is
# never a real number, so the us-phone-number rule must not flag it. These are
# the intentional fixtures that prove the PII blocker works, in the PII test and
# in two GRC evidence documents. Allowlisting the reserved range keeps real
# phone numbers detectable while ending the false positives (was POAM-AUTO-0076
# to 0078, all us-phone-number, 2026-09-12).
regexes = [
  '''\([0-9]{3}\)\s*555-[0-9]{4}''',
]
