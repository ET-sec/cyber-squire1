title = "Gitleaks config — cyber-squire-ops"

# CRITICAL: a custom config REPLACES gitleaks' built-in ruleset unless it
# extends it. Without this block, only the custom tripwires below ran and a
# real AWS/GitHub/Slack key would pass undetected (proven live 2026-08-31,
# Phase 20.1 hardening). useDefault pulls in the full default ruleset;
# the tripwires below are additions on top, not the whole defense.
[extend]
useDefault = true

# Custom rules: block infrastructure details from public commits
[[rules]]
id = "droplet-ip"
description = "DigitalOcean droplet IP address"
regex = '''161\.35\.0\.184'''
tags = ["infrastructure"]

[[rules]]
id = "legacy-ec2-ip"
description = "Legacy AWS EC2 IP address"
regex = '''54\.234\.155\.244'''
tags = ["infrastructure"]

[[rules]]
id = "internal-hostnames"
description = "Internal service hostnames"
regex = '''(n8n|ssh|vault)\.tigouetheory\.com'''
tags = ["infrastructure"]

[[rules]]
id = "doppler-config-path"
description = "Doppler project/config identifiers"
regex = '''coredirective-engine/(prd|stg|dev)'''
tags = ["infrastructure"]

[[rules]]
id = "droplet-paths"
description = "Droplet filesystem paths"
regex = '''/root/COREDIRECTIVE_ENGINE'''
tags = ["infrastructure"]

[[rules]]
id = "docker-subnet"
description = "Internal Docker network subnet"
regex = '''172\.28\.0\.\d+'''
tags = ["infrastructure"]

[[rules]]
id = "db-credentials-username"
description = "Database username"
regex = '''cd_admin'''
tags = ["infrastructure"]

[[rules]]
id = "db-name"
description = "Internal database name"
regex = '''cd_automation_db'''
tags = ["infrastructure"]

[[rules]]
id = "datadog-region"
description = "Datadog site region"
regex = '''us5\.datadoghq\.com'''
tags = ["infrastructure"]

[[rules]]
id = "do-spaces-buckets"
description = "DigitalOcean Spaces bucket names"
regex = '''cd-(terraform-state|audit-logs)'''
tags = ["infrastructure"]

[[rules]]
id = "telegram-chat-id"
description = "Personal Telegram chat ID"
regex = '''6691629392'''
tags = ["pii"]

[[rules]]
id = "phone-number"
description = "Personal phone number"
regex = '''\(404\)\s*839-2214'''
tags = ["pii"]

[[rules]]
id = "cloudflare-zone-id"
description = "Cloudflare Zone ID"
regex = '''44f6a683c92275d8fea6f6702589c608'''
tags = ["infrastructure"]

[[rules]]
id = "cloudflare-account-id"
description = "Cloudflare Account ID"
regex = '''e4871d2a375f9719092b286866ce26f2'''
tags = ["infrastructure"]

[[rules]]
id = "cloudflare-tunnel-id"
description = "Cloudflare Tunnel ID"
regex = '''4bcf8238-8a8d-423d-b333-e8fe033d4de9'''
tags = ["infrastructure"]

[[rules]]
id = "do-droplet-id"
description = "DigitalOcean Droplet ID"
regex = '''557327264'''
tags = ["infrastructure"]

[[rules]]
id = "personal-email-login"
description = "Personal email used as service login"
regex = '''emmanueltigoue@gmail\.com'''
tags = ["pii"]

[allowlist]
description = "Known rotated/revoked secrets in git history. Telegram bot token was revoked on 2026-03-08."
commits = [
  "b1cd5c8ad6ef23129a132238df27b8c9deb60d98",
  "266200151b40c9ef00085d01732d7620958b03b5",
  "592dd2d5328ea8b69202bb4550481ce6810db605",
  "d4057ff0290b758587c1a64d3a0867c13ce364de",
  "1fb410cae26524a86294a10c0038719cc4b2eef5",
  "34772ebf577180534e7055473a0d029b25c98bea",
  "dff53aad0b25919531a29ca2c17d394e2b6f7077",
  "25634795d1aff7294f14a7995434037daca1327d",
  "de02153e4cd8058b192ef7cd7f167137cb8dba7c",
  "0a160f7c9486001d20601e508437c18e062a3eff",
]
